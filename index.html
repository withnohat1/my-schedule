<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>我的日程</title>
<style>
  :root{
    --bg:#F7F5F0;
    --bg-2:#EFEBE2;
    --surface:#FFFFFF;
    --ink:#1F1D1A;
    --ink-2:#5E5A52;
    --ink-3:#9B958A;
    --line:rgba(31,29,26,.09);
    --line-strong:rgba(31,29,26,.17);
    --shadow:0 1px 2px rgba(20,18,14,.04), 0 10px 26px -14px rgba(20,18,14,.18);
    --shadow-lg:0 18px 40px -20px rgba(20,18,14,.30);
    --accent-fill:#1F1D1A;
    --accent-ink:#FFFFFF;
    --accent:#3F7A5C;
    --ex-done:#2E5233;   /* 运动卡点亮色：深墨绿 */
    --accent-soft:rgba(63,122,92,.12);
    --bar-track:rgba(31,29,26,.07);
    --tile-idle:color-mix(in srgb, var(--ink) 8%, var(--surface));
    --mini-off:color-mix(in srgb, var(--ink) 10%, var(--surface));
    --rpt-good:#3F7A5C;
    --rpt-bad:#A9703C;
    /* 支出分类：黑白灰米五档，只有饮食用绿点一下 */
    --cat-food:#3F7A5C;
    --cat-life:#1F1D1A;
    --cat-fun:#B0A794;
    --cat-shop:#6E6A63;
    --cat-social:#CFC7B7;
    /* 运动三类：绿 / 黑 / 米 */
    --ex-cardio:#3F7A5C;
    --ex-function:#1F1D1A;
    --ex-focus:#B0A794;
    /* 睡眠折线：深灰入睡 / 绿起床 */
    --sleep-bed:#4A453D;
    --sleep-wake:#3F7A5C;
    --r-lg:22px;
    --r-md:18px;
    --r-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141311;
      --bg-2:#1B1A17;
      --surface:#1F1E1A;
      --ink:#F2EFE8;
      --ink-2:#B3ADA2;
      --ink-3:#7B756B;
      --line:rgba(255,255,255,.09);
      --line-strong:rgba(255,255,255,.17);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.8);
      --shadow-lg:0 18px 40px -20px rgba(0,0,0,.9);
      --accent-fill:#F2EFE8;
      --accent-ink:#141311;
      --accent:#86C4A2;
      --ex-done:#2E7D4F;   /* 暗色下亮一档的深绿，保证和深底拉开 */
      --accent-soft:rgba(134,196,162,.16);
      --bar-track:rgba(255,255,255,.09);
      --rpt-good:#86C4A2;
      --rpt-bad:#D9A272;
      --cat-food:#86C4A2;
      --cat-life:#EDE8DE;
      --cat-fun:#9C958A;
      --cat-shop:#C2BBAE;
      --cat-social:#6E6A63;
      --ex-cardio:#86C4A2;
      --ex-function:#EDE8DE;
      --ex-focus:#9C958A;
      --sleep-bed:#C9C2B6;
      --sleep-wake:#86C4A2;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);
    background-image:
      radial-gradient(900px 520px at 10% -10%, rgba(63,122,92,.10), transparent 62%),
      radial-gradient(780px 480px at 98% 0%, rgba(196,186,166,.45), transparent 58%);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;
  }
  .app{
    max-width:620px;
    margin:0 auto;
    padding:26px 20px 132px;
  }

  /* ---------- 顶部 ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
  .date-title{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.16;margin:0}
  .date-title .wd{font-size:16px;font-weight:600;color:var(--ink-2);margin-left:8px;letter-spacing:0}
  /* 周视图标题：日期独占一行，压字号 + 收字距保证再窄也不折行 */
  .date-title.range{font-size:26px;letter-spacing:-.035em;white-space:nowrap;font-variant-numeric:tabular-nums}
  .date-title.range .range-sep{color:var(--ink-3);font-weight:600;margin:0 2px}
  .date-sub{font-size:12.5px;color:var(--ink-2);margin-top:7px;display:flex;align-items:center;gap:6px}
  .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--ink-3);display:inline-block}
  .nav{display:flex;gap:6px;flex-shrink:0;padding-bottom:3px}
  .nav button{
    height:36px;min-width:36px;padding:0 12px;border-radius:var(--r-sm);
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:grid;place-items:center;
    box-shadow:var(--shadow);transition:transform .15s,color .2s,background .2s;
  }
  .nav button:hover{color:var(--ink)}
  .nav button:active{transform:scale(.94)}
  .nav .ico{font-size:15px;line-height:1;padding-bottom:2px}

  /* ---------- 进度卡 ---------- */
  .pv-card{
    display:flex;align-items:center;gap:18px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:17px 20px;box-shadow:var(--shadow);margin-bottom:16px;
    transition:box-shadow .3s,border-color .3s;
  }
  .pv-card.all-done{border-color:color-mix(in srgb, var(--accent) 45%, transparent);box-shadow:0 12px 30px -16px color-mix(in srgb, var(--accent) 55%, transparent)}
  .ringwrap{position:relative;width:64px;height:64px;flex-shrink:0}
  .ring{width:64px;height:64px;transform:rotate(-90deg);display:block}
  .ring circle{fill:none;stroke-width:5.5;stroke-linecap:round}
  .ring .bg{stroke:var(--bar-track)}
  .ring .fg{stroke:url(#ringGrad);stroke-dasharray:163.36;stroke-dashoffset:163.36;transition:stroke-dashoffset .55s cubic-bezier(.34,1.2,.4,1)}
  .ring-label{position:absolute;inset:0;display:grid;place-items:center}
  .ring-label .rl{display:flex;align-items:baseline;gap:1.5px;font-size:15px;line-height:1}
  .ring-label b{font-weight:700;letter-spacing:-.02em}
  .ring-label span{font-size:10.5px;color:var(--ink-3);font-weight:600}
  .pv-text{min-width:0;flex:1}
  .pv-title{display:flex;align-items:baseline;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
  .pv-state{letter-spacing:0;font-weight:700;color:var(--ink-2)}
  .pv-state::before{content:"· ";color:var(--ink-3);font-weight:700}
  .pv-state.full{color:var(--accent)}
  .pv-state.full::before{color:var(--accent)}
  .pv-es{
    font-family:Georgia,"Times New Roman","Songti SC",serif;font-style:italic;
    font-size:14.5px;line-height:1.36;font-weight:600;margin-top:6px;letter-spacing:0;
    color:var(--ink);word-break:break-word;
  }
  .pv-cn{font-size:11.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.01em}

  /* ---------- 色块网格 ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .tile{
    position:relative;display:flex;flex-direction:column;align-items:flex-start;
    gap:9px;padding:15px 15px 13px;min-height:126px;
    border-radius:var(--r-md);border:1.5px solid var(--line);
    background:var(--tile-idle);color:var(--ink);cursor:pointer;text-align:left;
    font:inherit;box-shadow:var(--shadow);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    transition:transform .18s cubic-bezier(.34,1.4,.5,1),box-shadow .3s,background .35s,border-color .3s,color .2s;
    overflow:hidden;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-strong);background:color-mix(in srgb, var(--c) 9%, var(--tile-idle))}
  .tile:active{transform:scale(.965)}
  .tile:focus-visible{outline:2px solid var(--ink-3);outline-offset:2px}
  .tile-ic{
    position:relative;z-index:1;width:34px;height:34px;border-radius:11px;
    display:grid;place-items:center;font-size:17px;line-height:1;
    background:var(--surface);box-shadow:0 1px 3px rgba(20,20,30,.10);
    filter:grayscale(1);opacity:.9;
    transition:background .3s,transform .3s,box-shadow .3s,filter .3s;
  }
  .tile-name{position:relative;z-index:1;font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.28;color:var(--ink-2);transition:color .3s}
  .tile-extra{position:relative;z-index:1;display:block;width:100%}
  .wbar{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:100%}
  .wbar i{display:block;height:5px;border-radius:99px;background:color-mix(in srgb, var(--ink) 13%, transparent);transition:background .3s}
  .wbar i.on{background:var(--c)}
  .tile.done .wbar i{background:rgba(255,255,255,.34)}
  .tile.done .wbar i.on{background:#fff}
  .tile-meta{position:relative;z-index:1;display:block;width:100%;font-size:11px;font-weight:650;color:var(--ink-3);margin-top:auto;letter-spacing:.01em;line-height:1.3}
  .tile-meta b{font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.015em}
  .tile-meta .tm-time{display:block;font-size:10.5px;font-weight:800;color:var(--ink-2);letter-spacing:0;white-space:nowrap}
  .tile-meta .tm2{display:block;font-size:10px;font-weight:650;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-meta .tm2.ok{color:var(--accent)}
  .tile-meta .tm2.no{color:#9A7B4F}
  .tm-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .wminus{
    width:20px;height:20px;flex-shrink:0;padding:0;border-radius:7px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
    font:inherit;font-size:13px;line-height:1;display:grid;place-items:center;
    transition:transform .15s,background .2s,color .2s;
  }
  .wminus:hover{background:var(--bg-2);color:var(--ink)}
  .wminus:active{transform:scale(.9)}
  .tile.done .wminus{background:rgba(255,255,255,.24);border-color:transparent;color:#fff}
  .tile.done .tile-meta b,.tile.done .tile-meta .tm-time{color:#fff}
  .tile.done .tile-meta .tm2{color:rgba(255,255,255,.8)}
  .tile-check{
    position:absolute;z-index:2;top:12px;right:12px;width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:11px;line-height:1;
    color:transparent;transition:all .28s cubic-bezier(.34,1.4,.5,1);
  }
  /* 完成态：点亮 */
  .tile.done{
    background:linear-gradient(152deg,var(--c) 0%,var(--cd) 100%);
    border-color:transparent;color:#fff;
    box-shadow:0 12px 26px -14px var(--c),0 2px 0 rgba(255,255,255,.18) inset;
  }
  .tile.done .tile-ic{background:rgba(255,255,255,.22);filter:none;opacity:1;transform:scale(1.02);box-shadow:none}
  .tile.done .tile-name{color:#fff}
  .tile.done .tile-meta{color:rgba(255,255,255,.82)}
  .tile.done .tile-check{background:#fff;border-color:#fff;color:var(--cd);font-size:12px;font-weight:800;transform:scale(1.05)}
  .tile.flash{animation:flash .55s ease}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 40%, transparent)}
    55%{box-shadow:0 0 0 10px transparent}
    100%{box-shadow:0 12px 26px -14px var(--c)}
  }
  /* 暗色：图标底色需要比卡片更亮一点 */
  @media (prefers-color-scheme: dark){
    .tile-ic{background:rgba(255,255,255,.07);box-shadow:none}
  }

  /* ---------- 周视图（七天横向） ---------- */
  .wk-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);padding:12px 8px 10px;
  }
  .wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .wk-col{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:9px 1px 7px;border-radius:12px;transition:background .25s;
  }
  .wk-col.is-today{background:rgba(16,185,129,.07);box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent)}
  .wk-dow{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
  .wk-col.is-today .wk-dow{color:var(--accent)}
  .wk-num{font-size:15px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:-2px}
  .wk-col.is-today .wk-num{color:var(--accent)}
  .wk-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;max-width:54px;margin-top:1px}
  .mi{
    width:100%;aspect-ratio:1/1;border-radius:4px;border:0;padding:0;cursor:pointer;
    background:var(--mini-off);transition:background .25s,transform .15s,box-shadow .2s;
  }
  .mi:hover{transform:scale(1.18)}
  .mi.on{background:var(--c);box-shadow:0 2px 6px -2px var(--c)}
  .mi:active{transform:scale(.9)}
  .wk-cnt{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.01em}
  .wk-cnt.full{color:var(--accent)}

  /* ---------- 面板（待办 / 每周任务） ---------- */
  .panel{
    margin-top:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-lg);box-shadow:var(--shadow);padding:15px 16px 14px;
  }
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .panel-title{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em}
  .panel-sub{font-size:11px;font-weight:650;color:var(--ink-3);letter-spacing:.01em}
  .panel-sub.full{color:var(--accent)}

  /* 待办 */
  .td{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .td:last-child{border-bottom:0}
  .td-check{
    width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-strong);
    background:transparent;cursor:pointer;flex-shrink:0;display:grid;place-items:center;
    color:transparent;font-size:11px;font-weight:800;line-height:1;
    transition:all .22s cubic-bezier(.34,1.4,.5,1);
  }
  .td-check:hover{border-color:var(--ink-3);transform:scale(1.08)}
  .td.done .td-check{background:var(--accent);border-color:var(--accent);color:#fff}
  .td-text{flex:1;min-width:0;font-size:13.5px;line-height:1.4;word-break:break-word;transition:color .2s}
  .td.done .td-text{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px}
  .td-del{
    border:0;background:transparent;color:var(--ink-3);font-size:17px;line-height:1;
    padding:3px 7px;cursor:pointer;border-radius:9px;flex-shrink:0;transition:.2s;
  }
  .td-del:hover{color:#B4573A;background:rgba(180,87,58,.09)}
  .td-empty{font-size:12.5px;color:var(--ink-3);padding:9px 0 4px}
  .todo-add{display:flex;gap:8px;margin-top:12px}
  .todo-add input{
    flex:1;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--ink);font:inherit;font-size:13.5px;outline:none;transition:.2s;
  }
  .todo-add input::placeholder{color:var(--ink-3)}
  .todo-add input:focus{border-color:var(--ink-3);background:var(--surface)}
  .todo-add button{
    padding:0 17px;border-radius:12px;border:0;cursor:pointer;
    background:var(--accent-fill);color:var(--accent-ink);font:inherit;font-size:13px;font-weight:700;
    transition:transform .15s,opacity .2s;
  }
  .todo-add button:active{transform:scale(.96)}

  /* 记账 */
  .exp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .exp:last-child{border-bottom:0}
  .exp-text{flex:1;min-width:0;font-size:13.5px;line-height:1.4;word-break:break-word}
  .exp-amt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
  .exp-del{
    border:0;background:transparent;color:var(--ink-3);font-size:17px;line-height:1;
    padding:3px 7px;cursor:pointer;border-radius:9px;flex-shrink:0;transition:.2s;
  }
  .exp-del:hover{color:#B4573A;background:rgba(180,87,58,.09)}
  .exp-empty{font-size:12.5px;color:var(--ink-3);padding:9px 0 4px}
  .exp-sum{font-size:13.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .exp-add{display:grid;grid-template-columns:106px 1fr;gap:7px;margin-top:12px}
  .exp-add .wide{grid-column:1/-1}
  .exp-cats{display:flex;gap:5px}
  .exp-add .exp-cats button{
    flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-2);
    font:inherit;font-size:11.5px;font-weight:700;line-height:1.2;padding:7px 0;border-radius:9px;cursor:pointer;
    white-space:nowrap;transition:background .18s,color .18s,box-shadow .18s;
  }
  .exp-add .exp-cats button:hover{color:var(--ink);border-color:var(--line-strong)}
  .exp-add .exp-cats button.on{
    background:color-mix(in srgb, var(--c) 15%, var(--surface));color:var(--cd);
    border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--c);
  }
  .exp-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--dc);opacity:.85}
  .exp-add input{
    width:100%;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--ink);font:inherit;font-size:13.5px;outline:none;transition:.2s;
  }
  .exp-add input::placeholder{color:var(--ink-3)}
  .exp-add input:focus{border-color:var(--ink-3);background:var(--surface)}
  .exp-money{display:flex;align-items:center;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);transition:.2s}
  .exp-money:focus-within{border-color:var(--ink-3);background:var(--surface)}
  .exp-money span{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-right:2px;flex-shrink:0}
  .exp-money input{
    border:0;background:transparent;padding:11px 0;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  }
  .exp-money input:focus{border:0;background:transparent}
  .exp-add button{
    padding:0 16px;border-radius:12px;border:0;cursor:pointer;
    background:var(--accent-fill);color:var(--accent-ink);font:inherit;font-size:13px;font-weight:700;
    transition:transform .15s,opacity .2s;
  }
  .exp-add button:active{transform:scale(.96)}

  /* ---------- 理财复盘弹层 ---------- */
  .fin-list{display:flex;flex-direction:column;gap:7px;margin-top:13px}
  .fin-row{
    display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:11px;
    padding:10px 12px;border-radius:13px;background:var(--bg-2);
  }
  .fin-row-main{min-width:0}
  .fin-row-nm{
    font-size:13px;font-weight:700;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .fin-row-code{
    margin-top:2px;font-size:10.5px;font-weight:650;color:var(--ink-3);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .fin-row-amt{text-align:right;line-height:1.3;flex-shrink:0}
  .fin-row-profit{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .fin-row-profit.up{color:var(--accent)}
  .fin-row-profit.down{color:#B4573A}
  .fin-row-cost{margin-top:2px;font-size:10.5px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .fin-del{
    border:0;background:transparent;color:var(--ink-3);font-size:17px;line-height:1;
    padding:3px 6px;border-radius:9px;cursor:pointer;flex-shrink:0;transition:.2s;
  }
  .fin-del:hover{color:#B4573A;background:rgba(180,87,58,.09)}
  .fin-empty{font-size:12.5px;color:var(--ink-3);line-height:1.55;padding:4px 0 2px}

  .fin-sum{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin-top:14px;padding:13px 15px;border-radius:15px;background:var(--bg-2);
  }
  .fin-sum-l{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
  .fin-sum-v{
    margin-top:3px;font-size:21px;font-weight:800;letter-spacing:-.03em;
    line-height:1.15;font-variant-numeric:tabular-nums;
  }
  .fin-sum-v small{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-left:2px;letter-spacing:0}
  .fin-sum-v.up{color:var(--accent)}
  .fin-sum-v.down{color:#B4573A}
  .fin-sum-d{margin-top:3px;font-size:10.5px;font-weight:650;color:var(--ink-3)}

  .fin-form{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    margin-top:15px;padding-top:14px;border-top:1px solid var(--line);
  }
  .fin-form label{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fin-form input{
    width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--ink);font:inherit;font-size:13.5px;font-weight:650;
    outline:none;transition:border-color .2s,background .2s;
  }
  .fin-form input::placeholder{color:var(--ink-3);font-weight:600}
  .fin-form input:focus{border-color:var(--ink-3);background:var(--surface)}
  .fin-form input.bad{border-color:#B4573A;background:rgba(180,87,58,.07)}
  .fin-form input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .fin-form input[type=number]::-webkit-outer-spin-button,
  .fin-form input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .fin-form .fin-submit{
    grid-column:1/-1;margin-top:2px;padding:12px;border-radius:13px;border:0;cursor:pointer;
    background:var(--accent-fill);color:var(--accent-ink);font:inherit;font-size:13.5px;font-weight:750;
    transition:transform .15s;
  }
  .fin-form .fin-submit:active{transform:scale(.98)}
  .fin-hint{
    grid-column:1/-1;margin:0;font-size:11.5px;font-weight:700;color:#B4573A;line-height:1.4;
  }
  .fin-hint:empty{display:none}

  /* 每周任务：3 列 × 2 行 */
  .wtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .wtile{
    position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;
    padding:11px 9px 10px;min-height:84px;border-radius:14px;
    border:1.5px solid var(--line);background:var(--tile-idle);color:var(--ink);
    cursor:pointer;font:inherit;text-align:left;
    transition:transform .18s cubic-bezier(.34,1.4,.5,1),box-shadow .3s,background .35s,border-color .3s;
  }
  .wtile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-strong);background:color-mix(in srgb, var(--c) 9%, var(--tile-idle))}
  .wtile:active{transform:scale(.97)}
  .wtile-ic{
    width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13.5px;line-height:1;
    background:var(--surface);box-shadow:0 1px 3px rgba(20,20,30,.10);
    filter:grayscale(1);opacity:.9;
    transition:background .3s,filter .3s,opacity .3s,transform .3s,box-shadow .3s;
  }
  .wtile-name{font-size:11.5px;font-weight:650;line-height:1.25;color:var(--ink-2);letter-spacing:-.01em;transition:color .3s}
  /* 理财复盘：卡上顺便显示本周收益 */
  .wtile-meta{
    margin-top:auto;font-size:10px;font-weight:750;letter-spacing:-.01em;
    color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;
    transition:color .3s;
  }
  .wtile-meta.up{color:var(--accent)}
  .wtile-meta.down{color:#B4573A}
  .wtile-check{
    position:absolute;top:10px;right:10px;width:16px;height:16px;border-radius:50%;
    border:1.5px solid var(--line-strong);display:grid;place-items:center;
    font-size:9px;color:transparent;transition:all .28s cubic-bezier(.34,1.4,.5,1);
  }
  .wtile.done{
    background:linear-gradient(152deg,var(--c) 0%,var(--cd) 100%);
    border-color:transparent;color:#fff;
    box-shadow:0 10px 22px -14px var(--c);
  }
  .wtile.done .wtile-ic{background:rgba(255,255,255,.22);filter:none;opacity:1;box-shadow:none;transform:scale(1.03)}
  .wtile.done .wtile-name{color:#fff}
  .wtile.done .wtile-meta{color:rgba(255,255,255,.88)}
  .wtile.done .wtile-check{background:#fff;border-color:#fff;color:var(--cd);font-weight:800}
  @media (prefers-color-scheme: dark){
    .wtile-ic{background:rgba(255,255,255,.07);box-shadow:none}
  }

  /* ---------- 月视图 ---------- */
  .mo-head{display:grid;grid-template-columns:repeat(7,1fr) 26px;gap:5px;margin-bottom:6px}
  .mo-head div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);padding:4px 0}
  .mo-grid{display:grid;grid-template-columns:repeat(7,1fr) 26px;gap:5px}
  .mo-cell{
    position:relative;min-height:62px;border-radius:12px;border:1px solid transparent;
    background:var(--surface);box-shadow:var(--shadow);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font:inherit;color:var(--ink);padding:7px 2px;transition:.18s;
  }
  .mo-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .mo-cell.out{opacity:.34;background:transparent;box-shadow:none}
  .mo-cell.out .mo-mini{visibility:hidden}
  .mo-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .mo-num{font-size:11.5px;font-weight:650;letter-spacing:-.02em}
  .mo-cell.today .mo-num{color:var(--accent);font-weight:800}
  .mo-mini{
    display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
    width:78%;max-width:44px;
  }
  .mo-mini i{display:block;aspect-ratio:1/1;border-radius:2.5px;background:var(--mini-off)}
  .mo-mini i.on{background:var(--mc)}
  .mo-cell.full-day{background:rgba(16,185,129,.08)}
  /* 每行右侧：每周任务概览（6 项，2 列 3 行） */
  .mo-ov{
    display:grid;grid-template-columns:repeat(2,8px);gap:3px;
    align-content:center;justify-content:center;
  }
  .mo-ov i{display:block;width:8px;height:8px;border-radius:2.5px;background:var(--mini-off);transition:background .3s}
  .mo-ov i.on{background:var(--wc)}

  /* 每月资金：工资 / 资产 两个入口 */
  .mo-money{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .mo-money-card{
    display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left;
    padding:12px 13px 11px;border-radius:var(--r-md);border:1px solid var(--line);
    background:var(--surface);box-shadow:var(--shadow);font:inherit;color:var(--ink);
    cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;
  }
  .mo-money-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .mo-money-card:active{transform:scale(.985)}
  .mo-money-l{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:11px;font-weight:750;letter-spacing:.02em;color:var(--ink-2)}
  .mo-money-l em{font-style:normal;font-size:10px;font-weight:650;letter-spacing:0;color:var(--ink-3)}
  .mo-money-v{
    font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.12;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mo-money-v.none{color:var(--ink-3);font-weight:700;letter-spacing:-.02em}
  .mo-money-h{font-size:10.5px;font-weight:650;color:var(--ink-3);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .mo-money-h.up{color:var(--rpt-good)}
  .mo-money-h.down{color:var(--rpt-bad)}

  /* 弹层里的一行提示：平时空着不占位，只在填错时冒出来 */
  .sh-hint{margin:9px 0 0;font-size:11.5px;font-weight:650;color:var(--ink-3);line-height:1.5}
  .sh-hint:empty{display:none}
  .sh-hint.bad{color:#B4573A}

  /* ---------- 记录弹层 ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet-backdrop{
    position:absolute;inset:0;background:rgba(20,20,26,.44);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    animation:fadeIn .2s ease both;
  }
  .sheet{
    position:relative;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
    background:var(--surface);border-radius:24px 24px 0 0;
    padding:9px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px -18px rgba(0,0,0,.45);
    animation:sheetUp .3s cubic-bezier(.22,1,.36,1) both;
    -webkit-overflow-scrolling:touch;
  }
  .sheet-grab{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto 14px}
  .sh-title{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.02em}
  .sh-sub{margin:6px 0 0;font-size:12px;color:var(--ink-3);line-height:1.5}
  .sh-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .sh-field{display:flex;flex-direction:column;gap:6px;margin-top:13px}
  .sh-grid2 .sh-field{margin-top:0}
  .sh-label{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
  .sh-field input{
    width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--ink);font:inherit;font-size:15px;font-weight:650;
    outline:none;transition:border-color .2s,background .2s;
  }
  .sh-field input:focus{border-color:var(--ink-3);background:var(--surface)}
  .sh-field input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .sh-field input[type=number]::-webkit-outer-spin-button,
  .sh-field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .sh-result{
    display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-top:14px;
    padding:14px 15px;border-radius:15px;background:var(--bg-2);
  }
  .sh-result b{font-size:23px;font-weight:800;letter-spacing:-.03em}
  .sh-result .sh-note{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .sh-chip{font-size:10.5px;font-weight:800;padding:3.5px 8px;border-radius:99px;letter-spacing:.02em}
  .sh-chip.ok{color:var(--accent);background:var(--accent-soft)}
  .sh-chip.no{color:#9A7B4F;background:rgba(154,123,79,.16)}
  .sh-presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
  .sh-presets button{
    border:1px solid var(--line);background:var(--bg-2);color:var(--ink-2);
    font:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:99px;cursor:pointer;transition:.18s;
  }
  .sh-presets button:hover{border-color:var(--ink-3);color:var(--ink);background:var(--surface)}
  .sh-presets button.on{background:var(--accent-fill);color:var(--accent-ink);border-color:transparent}
  .sh-actions{display:flex;gap:9px;margin-top:18px}
  .sh-actions button{
    flex:1;border-radius:14px;padding:13px;border:1px solid transparent;
    font:inherit;font-size:13.5px;font-weight:750;cursor:pointer;transition:transform .15s,opacity .2s;
  }
  .sh-actions button:active{transform:scale(.98)}
  .sh-actions .primary{background:var(--accent-fill);color:var(--accent-ink)}
  .sh-actions .ghost{flex:0 0 90px;background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
  .sh-link{
    display:block;width:100%;margin-top:11px;border:0;background:transparent;color:var(--ink-3);
    font:inherit;font-size:12px;font-weight:650;cursor:pointer;padding:8px;border-radius:10px;transition:.2s;
  }
  .sh-link:hover{color:#B4573A;background:rgba(180,87,58,.07)}

  /* ---------- 运动类型选择 ---------- */
  .ex-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
  .ex-card{
    position:relative;overflow:hidden;isolation:isolate;
    display:flex;flex-direction:column;justify-content:flex-end;gap:1px;
    min-height:84px;padding:12px 11px 11px;text-align:left;
    border:1px solid var(--line);border-radius:17px;background:var(--bg-2);
    font:inherit;color:var(--ink);cursor:pointer;
    transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;
  }
  .ex-card:hover{transform:translateY(-2px);background:var(--surface)}
  .ex-card:active{transform:scale(.975)}
  .ex-art{position:absolute;right:-6px;top:-5px;width:70px;height:70px;z-index:0;opacity:.13;color:var(--ink);pointer-events:none}
  .ex-art svg{display:block;width:100%;height:100%}
  .ex-nm{position:relative;z-index:1;font-size:13.5px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
  .ex-en{position:relative;z-index:1;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .ex-card[aria-pressed="true"]{
    border-color:transparent;background:color-mix(in srgb, var(--c) 15%, var(--surface));
    box-shadow:inset 0 0 0 1.5px var(--c);
  }
  .ex-card[aria-pressed="true"] .ex-art{opacity:.32;color:var(--c)}
  .ex-card[aria-pressed="true"] .ex-nm{color:var(--cd)}
  .ex-card[aria-pressed="true"] .ex-en{color:var(--c)}
  .ex-form[hidden]{display:none}
  .ex-note{margin:12px 0 0;font-size:12px;color:var(--ink-3);line-height:1.55}
  .ex-note:empty{display:none}
  .ex-note.miss{color:#B4573A;font-weight:700}
  .sh-field input.bad{border-color:#B4573A;background:rgba(180,87,58,.07)}
  .ex-hint{margin:11px 0 0;font-size:11.5px;font-weight:650;color:var(--ink-3);line-height:1.5;min-height:16px}
  .ex-hint:empty{display:none}
  .ex-hint.on{color:var(--ink-2)}
  .ex-type-chips{gap:5px}
  .ex-type-chips button{padding:7px 8px;font-size:11.5px}

  /* 专项：简笔人形 */
  .bf-wrap{
    margin-top:14px;padding:14px 10px 12px;border-radius:16px;background:var(--bg-2);
    display:flex;flex-direction:column;align-items:center;
  }
  .bf-svg{display:block;width:118px;height:auto;touch-action:manipulation;overflow:visible}
  .bf-head,.bf-limb{fill:none;stroke:color-mix(in srgb, var(--ink) 24%, transparent);stroke-width:2;stroke-linecap:round}
  .bf-part{cursor:pointer}
  .bf-part path{
    fill:color-mix(in srgb, var(--ink) 9%, transparent);
    stroke:color-mix(in srgb, var(--ink) 14%, transparent);
    stroke-width:1.5;stroke-linejoin:round;
    transition:fill .22s,stroke .22s;
  }
  .bf-part:hover path{fill:color-mix(in srgb, var(--ink) 17%, transparent)}
  .bf-part.on path{fill:var(--c);stroke:var(--cd);opacity:.92}
  .bf-chips{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;justify-content:center}
  .bf-chips button{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    font:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:99px;cursor:pointer;transition:.18s;
  }
  .bf-chips button:hover{border-color:var(--ink-3);color:var(--ink)}
  .bf-chips button.on{background:color-mix(in srgb, var(--c) 16%, var(--surface));color:var(--cd);border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
  .bf-chips button .bp-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);
    margin-right:5px;vertical-align:1px;opacity:.85;
  }
  .bf-chips button:not(.on) .bp-dot{opacity:.32;background:var(--ink-3)}
  .bf-sub{margin:9px 0 0;font-size:10.5px;font-weight:650;color:var(--ink-3);letter-spacing:.01em}
  @media (prefers-color-scheme: dark){
    .ex-art{opacity:.2}
    .ex-card[aria-pressed="true"] .ex-art{opacity:.42}
    .ex-card:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.045)}
  }
  @keyframes sheetUp{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- 底部导航 ---------- */
  .tabbar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex;gap:3px;padding:5px;z-index:40;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid var(--line);border-radius:999px;box-shadow:0 14px 34px -14px rgba(20,20,30,.34);
  }
  @media (prefers-color-scheme: dark){
    .tabbar{background:rgba(30,30,36,.78)}
  }
  .tabbar button{
    border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:650;
    color:var(--ink-2);padding:9px 20px;border-radius:999px;cursor:pointer;transition:.22s;
  }
  .tabbar button[aria-selected="true"]{background:var(--accent-fill);color:var(--accent-ink)}
  .tabbar button:not([aria-selected="true"]):hover{color:var(--ink)}

  /* ---------- 周报入口卡 ---------- */
  .wr-card{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    font:inherit;color:inherit;cursor:pointer;
    transition:border-color .2s,transform .15s,background .2s;
  }
  .wr-card:hover{border-color:var(--line-strong);background:var(--surface)}
  .wr-card:active{transform:scale(.99)}
  .wr-card-main{flex:1;min-width:0;display:block}
  .wr-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
  .wr-card-title{font-size:13px;font-weight:700;letter-spacing:-.01em}
  .wr-card-sub{font-size:11px;font-weight:650;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
  .wr-card-sum{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:12.5px;line-height:1.6;color:var(--ink-2);
  }
  .wr-card-go{font-size:20px;line-height:1;color:var(--ink-3);flex:0 0 auto;padding-right:2px}

  /* ---------- 周报页 ---------- */
  /* 周报是一张 A6 的纸（105 × 148mm）：屏幕上按窗口等比缩小显示，
     导出的 PDF 用同一套尺寸，看屏幕 = 看 PDF */
  .rpt{
    position:fixed;inset:0;z-index:70;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;background:#D7D1BD;
  }

  /* 周报专用配色：Bottega Green（深墨绿 / 草绿 / 米白 / 近黑）
     变量只挂在 .rpt 上，日/周/月视图不受影响 */
  .rpt{
    --bg:#EFEBDF;
    --bg-2:#E4DECD;
    --surface:#F9F7F0;
    --ink:#191E1A;
    --ink-2:#4A554C;
    --ink-3:#8E9789;
    --line:rgba(25,30,26,.10);
    --line-strong:rgba(25,30,26,.20);
    --bar-track:rgba(25,30,26,.08);
    --accent:#2E5233;
    --accent-soft:rgba(46,82,51,.11);
    --accent-fill:#2E5233;
    --accent-ink:#F9F7F0;
    --rpt-good:#3D7A4C;
    --rpt-bad:#93452F;
    --cat-food:#2E5233;
    --cat-life:#1C1C1C;
    --cat-fun:#93A588;
    --cat-shop:#5F9269;
    --cat-social:#B3A98C;
    --ex-cardio:#2E5233;
    --ex-function:#1C1C1C;
    --ex-focus:#5F9269;
    --sleep-bed:#2A3B2E;
    --sleep-wake:#5F9269;
  }
  .rpt-bar{
    position:sticky;top:0;z-index:3;flex:0 0 auto;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
    background:rgba(215,209,189,.88);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(25,30,26,.12);
  }
  .rpt-back{
    justify-self:start;
    border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;
    color:var(--ink-2);padding:6px 8px;border-radius:9px;cursor:pointer;
  }
  .rpt-back:hover{color:var(--ink);background:rgba(25,30,26,.07)}
  .rpt-bar-t{justify-self:center;font-size:11.5px;font-weight:750;color:var(--ink-2);letter-spacing:.02em}
  .rpt-bar-t em{font-style:normal;color:var(--ink-3);font-weight:650;margin-left:5px}
  .rpt-save{
    justify-self:end;border:1px solid rgba(25,30,26,.22);border-radius:9px;background:var(--surface);
    font:inherit;font-size:11.5px;font-weight:750;color:var(--ink-2);
    padding:7px 10px;cursor:pointer;white-space:nowrap;transition:transform .15s,color .2s,border-color .2s;
  }
  .rpt-save:hover{color:var(--ink);border-color:var(--ink-3)}
  .rpt-save:active{transform:scale(.95)}
  .rpt-save[disabled]{opacity:.55}

  /* 舞台：纸居中，窗口小就整体缩小，始终一页看完 */
  .rpt-stage{
    flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;
    padding:14px 10px calc(20px + env(safe-area-inset-bottom));
  }
  .rpt-hint{font-size:10.5px;font-weight:650;letter-spacing:.02em;color:rgba(25,30,26,.42);text-align:center}
  /* 窄竖屏纸很小，居中更稳；横屏 / 桌面纸接近满高，贴顶更好 */
  @media (max-width:560px) and (orientation:portrait){
    .rpt-stage{justify-content:center}
  }
  /* A5 横版：所有内容都装进 210×148mm（宽正好是 A6 的两倍） */
  .rpt-page{
    flex:0 0 auto;width:210mm;height:148mm;padding:22px;overflow:hidden;
    display:flex;flex-direction:column;
    background:var(--bg);color:var(--ink);
    box-shadow:0 1px 1px rgba(25,30,26,.10), 0 26px 56px -28px rgba(25,30,26,.62);
  }

  /* 抬头 */
  .rp-kick{font-size:10px;font-weight:700;letter-spacing:.045em;color:var(--ink-3);line-height:12px}
  .rp-title{
    margin:3px 0 0;display:flex;align-items:baseline;gap:9px;
    font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:28px;
  }
  .rp-title em{
    font-style:normal;font-size:15px;font-weight:750;letter-spacing:0;
    color:var(--accent);font-variant-numeric:tabular-nums;
  }

  /* 上半区：左（抬头 + 四格）｜ 右（睡眠，占满整个右列高度） */
  .rp-top{display:grid;grid-template-columns:380px 1fr;column-gap:24px;align-items:start}
  /* 睡眠段头顶端与四格卡片顶部对齐：抬头块实测 58（kick 12 + 标题 32 + 卡片上距 11） */
  .rp-top > .rp-sec{margin-top:58px}

  /* 四格：2×2 等大（状态 / 理财 / 运动 / 支出） */
  .rp-tiles{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,96px);gap:8px;margin-top:11px}
  .rp-tile{
    display:flex;flex-direction:column;min-width:0;overflow:hidden;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px 10px;
  }
  .rp-tile-l{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--ink-3);line-height:11px}
  .rp-tile-l em{font-style:normal;font-weight:700;letter-spacing:0;color:var(--ink-3);white-space:nowrap}
  .rp-tile-row{display:flex;align-items:baseline;gap:5px;margin-top:5px;min-width:0}
  .rp-tile-v{display:flex;align-items:baseline;gap:2px;
    font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:24px;white-space:nowrap}
  .rp-tile-v small{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:0}
  .rp-tile-v span{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:0}
  .rp-tile-v.up{color:var(--rpt-good)}
  .rp-tile-v.down{color:var(--rpt-bad)}
  .rp-tile-b{
    margin-top:auto;display:flex;align-items:baseline;gap:5px;height:14px;
    font-size:9.5px;font-weight:650;color:var(--ink-3);white-space:nowrap;line-height:14px;
  }
  .rp-tile-b b{font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .rp-tile-b .r{margin-left:auto;font-variant-numeric:tabular-nums}
  .rp-tile-b b.up{color:var(--rpt-good)}
  .rp-tile-b b.down{color:var(--rpt-bad)}

  /* 每天完成率（横跨整页，七根柱更宽） */
  .rp-days{margin-top:14px}
  .rp-days-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-3);line-height:13px}
  .rp-days-b{display:flex;align-items:flex-end;gap:9px;height:44px;margin-top:4px}
  .rp-days-b .d{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .rp-days-b .d i{display:block;width:34px;height:var(--h);min-height:3px;border-radius:3px;
    background:color-mix(in srgb, var(--ink) 24%, var(--bg-2))}
  .rp-days-b .d.full i,.rp-days-b .d.today i{background:var(--ink)}
  .rp-days-b .d.off i{height:9px;min-height:9px;background:transparent;border:1px dashed var(--line-strong);border-radius:3px}
  .rp-days-x{display:flex;gap:9px;margin-top:4px}
  .rp-days-x span{flex:1;min-width:0;text-align:center;font-size:8.5px;font-weight:700;color:var(--ink-3);line-height:12px}
  .rp-days-x span.today{color:var(--ink)}

  /* 下半区：运动 ｜ 支出，左右并排 */
  .rp-bottom{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;margin-top:14px;align-items:start}

  /* 分节（睡眠 / 运动 / 支出） */
  .rp-sec{margin-top:0}
  .rp-sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
  .rp-sec-h h3{margin:0;font-size:12px;font-weight:750;letter-spacing:-.01em;line-height:14px}
  .rp-sec-h span{font-size:9.5px;font-weight:650;color:var(--ink-3);white-space:nowrap;
    font-variant-numeric:tabular-nums;line-height:13px}
  .rp-sec-h span i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lc);margin-right:4px;vertical-align:0}
  .rp-empty{font-size:10px;font-weight:650;color:var(--ink-3);padding:8px 0}
  /* 没数据时也给下半区留出图表的位置，别让整页塌下来 */
  .rp-bottom .rp-empty{min-height:120px}
  .rp-top > .rp-sec .rp-empty{min-height:272px}   /* 与睡眠图同高，空态不改变整页节奏 */

  /* 睡眠：每天一根竖条（上=入睡，下=起床） */
  .rp-chart{display:block;width:100%;height:auto;overflow:visible}
  .rp-chart text{font-family:inherit;font-size:8.5px;fill:var(--ink-3);font-weight:650}
  .rp-chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2.5 3.5}

  /* 运动：每天柱 ｜ 圆环 + 图例 */
  .rp-ex{display:flex;align-items:flex-end;gap:12px}
  .rp-ex-main{flex:1;min-width:0}
  .rp-ex-b{display:flex;align-items:flex-end;gap:6px;height:105px}
  .rp-ex-b .d{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1.5px}
  .rp-ex-b .d i{display:block;flex:0 0 auto;width:100%;height:var(--h);min-height:3px;border-radius:3px;background:var(--k)}
  .rp-ex-b .d em{font-style:normal;font-size:8px;font-weight:750;color:var(--ink-3);line-height:10px}
  .rp-ex-x{display:flex;gap:6px;margin-top:4px}
  .rp-ex-x span{flex:1;text-align:center;font-size:8px;font-weight:700;color:var(--ink-3);line-height:11px}
  .rp-ex-side{display:flex;align-items:center;gap:9px;flex:0 0 auto;margin-bottom:15px}   /* 与柱区底对齐，不压到星期行 */
  .rp-legend{display:flex;flex-direction:column;gap:6px;width:60px}
  .rp-legend .row{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--ink-2);white-space:nowrap;line-height:11px}
  .rp-legend .row i{width:6px;height:6px;border-radius:2px;background:var(--lc);flex:0 0 auto}
  .rp-legend .row em{font-style:normal;margin-left:auto;padding-left:5px;color:var(--ink-3);font-weight:650;font-variant-numeric:tabular-nums}
  .rp-donut{position:relative;flex:0 0 auto;width:var(--sz);height:var(--sz)}
  .rp-donut svg{display:block}
  .rp-donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    line-height:1.15;font-size:8px;font-weight:800;color:var(--ink-2);letter-spacing:-.01em}

  /* 支出：分类横条，以最大一类为满格；行高 24 × 5 = 120 */
  .rp-cats{display:grid;grid-template-columns:40px 1fr auto;align-items:center;column-gap:9px;font-size:9.5px}
  .rp-cat{display:contents}
  .rp-cat .nm{font-weight:700;color:var(--ink-2);white-space:nowrap;line-height:24px}
  .rp-cat .tk{height:6px;border-radius:99px;background:var(--bar-track);overflow:hidden}
  .rp-cat .tk i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--kc)}
  .rp-cat .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap;line-height:24px}
  .rp-cat .vl em{font-style:normal;color:var(--ink-3);font-weight:650;margin-left:4px;font-size:8px}

  /* 导出时的提示 */
  .rpt-toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:95;background:rgba(25,30,26,.9);color:#F9F7F0;font-size:11.5px;font-weight:700;
    padding:9px 14px;border-radius:99px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);
    animation:toastIn .2s ease both;pointer-events:none;white-space:nowrap;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  @media (max-width:400px){
    .app{padding:20px 15px 128px}
    .tiles{gap:9px}
    .tile{padding:13px 12px 11px;min-height:116px;gap:8px}
    .tile-name{font-size:12.5px}
    .tile-ic{width:30px;height:30px;font-size:15px;border-radius:9px}
    .date-title{font-size:26px}
    .date-title .wd{font-size:14px}
    .date-title.range{font-size:23px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="page-head">
    <div>
      <h1 class="date-title" id="headTitle">—</h1>
      <div class="date-sub" id="headSub"></div>
    </div>
    <div class="nav">
      <button class="ico" id="btnPrev" aria-label="上一个">‹</button>
      <button id="btnToday">今天</button>
      <button class="ico" id="btnNext" aria-label="下一个">›</button>
    </div>
  </header>

  <!-- ============ 日视图 ============ -->
  <section id="view-day">
    <div class="pv-card" id="pvCard">
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#CFC7B7"/>
              <stop offset="45%" stop-color="#9CBBA8"/>
              <stop offset="100%" stop-color="var(--accent)"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="32" cy="32" r="26"/>
          <circle class="fg" cx="32" cy="32" r="26" id="ringFg"/>
        </svg>
        <div class="ring-label"><span class="rl"><b id="pvDone">0</b><span id="pvTotal">/9</span></span></div>
      </div>
      <div class="pv-text">
        <div class="pv-title">今日进度<span class="pv-state" id="pvState"></span></div>
        <div class="pv-es" id="pvEs"></div>
        <div class="pv-cn" id="pvCn"></div>
      </div>
    </div>

    <div class="tiles" id="tiles"></div>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">今日支出</h2>
        <span class="panel-sub exp-sum" id="expSub"></span>
      </div>
      <div id="expList"></div>
      <form class="exp-add" id="expForm" autocomplete="off">
        <input class="wide" type="text" id="expReason" placeholder="这笔钱花在什么上…" maxlength="24">
        <div class="wide exp-cats" id="expCats"></div>
        <label class="exp-money">
          <span>¥</span>
          <input type="text" id="expAmount" inputmode="decimal" placeholder="0.00" maxlength="9" aria-label="金额">
        </label>
        <button type="submit">记一笔</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">今日待办</h2>
        <span class="panel-sub" id="dayTodoSub"></span>
      </div>
      <div id="dayTodoList"></div>
      <form class="todo-add" id="dayTodoForm" autocomplete="off">
        <input type="text" id="dayTodoInput" placeholder="今天想做的事…" maxlength="40">
        <button type="submit">添加</button>
      </form>
    </section>
  </section>

  <!-- ============ 周视图 ============ -->
  <section id="view-week" hidden>
    <div class="wk-card">
      <div class="wk-grid" id="wkList"></div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">本周待办</h2>
        <span class="panel-sub" id="todoSub"></span>
      </div>
      <div id="todoList"></div>
      <form class="todo-add" id="todoForm" autocomplete="off">
        <input type="text" id="todoInput" placeholder="这周想完成的事…" maxlength="40">
        <button type="submit">添加</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">每周任务</h2>
        <span class="panel-sub" id="weeklySub"></span>
      </div>
      <div class="wtiles" id="wtiles"></div>
    </section>

    <button class="panel wr-card" id="wrCard" type="button">
      <span class="wr-card-main">
        <span class="wr-card-head">
          <span class="wr-card-title" id="wrCardTitle">本周周报</span>
          <span class="wr-card-sub" id="wrCardSub"></span>
        </span>
        <span class="wr-card-sum" id="wrCardSum"></span>
      </span>
      <span class="wr-card-go">›</span>
    </button>
  </section>

  <!-- ============ 月视图 ============ -->
  <section id="view-month" hidden>
    <div class="mo-money">
      <button class="mo-money-card" id="moSalaryCard" type="button">
        <span class="mo-money-l">工资<em>本月收入</em></span>
        <span class="mo-money-v none" id="moSalaryVal">—</span>
        <span class="mo-money-h" id="moSalaryHint">点这里填本月收入</span>
      </button>
      <button class="mo-money-card" id="moAssetsCard" type="button">
        <span class="mo-money-l">资产<em>本月余额</em></span>
        <span class="mo-money-v none" id="moAssetsVal">—</span>
        <span class="mo-money-h" id="moAssetsHint">点这里盘点本月余额</span>
      </button>
    </div>
    <div class="mo-head">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div><div>周</div>
    </div>
    <div class="mo-grid" id="moGrid"></div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-view="day" aria-selected="true">日</button>
  <button data-view="week" aria-selected="false">周</button>
  <button data-view="month" aria-selected="false">月</button>
</nav>

<!-- 记录弹层：睡眠 / 运动 -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sheet-grab"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- 周报：一张 A6 纸（105×148mm） -->
<div class="rpt" id="rpt" hidden>
  <header class="rpt-bar">
    <button class="rpt-back" id="rptBack" type="button">‹ 返回</button>
    <span class="rpt-bar-t" id="rptBarTitle">周报</span>
    <button class="rpt-save" id="rptSave" type="button">存 PDF</button>
  </header>
  <div class="rpt-stage" id="rptStage">
    <div class="rpt-page" id="rptBody"></div>
    <div class="rpt-hint">A5 横版 · 210 × 148mm · 点「存 PDF」保存这一页</div>
  </div>
</div>
<div class="rpt-toast" id="rptToast" hidden></div>

<script>
/* =========================================================
   数据层
   —— tasks: 任务定义（id / 名称 / emoji / 颜色）
   —— 想扩展默认任务，直接往 DEFAULT_TASKS 里加一行即可
   —— 数据存在浏览器 localStorage，后续接 GitHub + 云同步时替换这一层
   ========================================================= */
const DEFAULT_TASKS = [
  { id:'language',   name:'学习新语言', icon:'🌍', color:'#FF6B6B' },
  { id:'english',    name:'英语加强',   icon:'🔤', color:'#F5A524' },
  { id:'guitar',     name:'练习吉他',   icon:'🎸', color:'#A855F7' },
  { id:'water',      name:'喝水',       icon:'💧', color:'#38BDF8' },
  { id:'sleep',      name:'状态',       icon:'🌙', color:'#5561E8' },
  { id:'exercise',   name:'运动',       icon:'🏃', color:'var(--ex-done)' },
  { id:'diet',       name:'饮食健康',   icon:'🥗', color:'#84CC16' },
  { id:'hair',       name:'梳头发',     icon:'💇', color:'#F472B6' },
  { id:'supplement', name:'吃补剂',     icon:'💊', color:'#FB923C' }
];

const KEY_TASKS = 'song.tasks.v1';
const KEY_RECS  = 'song.records.v1';
const KEY_WEEKLY = 'song.weekly.v1';
const KEY_TODOS  = 'song.todos.v1';
const KEY_DAYTODOS = 'song.daytodos.v1';
const KEY_EXPENSES = 'song.expenses.v1';
const KEY_FINANCE  = 'song.finance.v1';     // 理财复盘：{ '周一日期': [{id,code,name,principal,profit}] }
const KEY_MONEY    = 'song.money.v1';       // 月资金：{ 'YYYY-MM': { salary, assets, at } }
const KEY_LOGS     = 'song.logs.v1';       // 明细：喝水杯数 / 睡眠时间 / 运动时长
const KEY_REPORTS  = 'song.reports.v1';    // 只存「自己手动记的」学习日报，不存工具数据的副本
const WEEK_CN   = ['周日','周一','周二','周三','周四','周五','周六'];

/* 需达标的规则 */
const WATER_GOAL     = 8;    // 一天 8 杯才算完成
const WATER_CUP_ML   = 200;  // 每杯 200ml
const SLEEP_GOAL_MIN = 450;  // 睡满 7.5 小时才点亮

/* 这几项点击后要弹层记录，不能只做二元打卡；学习新语言 / 英语加强点一下就点亮 */
const DETAIL_TASKS = { sleep:1, exercise:1 };

/* 支出分类：记账时选，周报按分类看结构 */
const EXP_CATS = [
  { id:'food',   name:'饮食', color:'var(--cat-food)',   hex:'#3F7A5C' },
  { id:'life',   name:'生活', color:'var(--cat-life)',   hex:'#1F1D1A' },
  { id:'fun',    name:'娱乐', color:'var(--cat-fun)',    hex:'#B0A794' },
  { id:'shop',   name:'购物', color:'var(--cat-shop)',   hex:'#6E6A63' },
  { id:'social', name:'人情', color:'var(--cat-social)', hex:'#CFC7B7' }
];
const EXP_CAT_MAP = EXP_CATS.reduce((m, c) => (m[c.id] = c, m), {});
/* 旧版分类 id → 新分类，老账不用改数据 */
const LEGACY_CAT = { transport:'life', shopping:'shop', health:'life', other:'social' };

/* 运动分三类，各有自己的记录方式 */
const EX_KINDS = {
  cardio:   { name:'有氧', en:'Cardio',   color:'var(--ex-cardio)', hex:'#3F7A5C' },
  function: { name:'功能', en:'Function', color:'var(--ex-function)', hex:'#1F1D1A' },
  focus:    { name:'专项', en:'Focus',    color:'var(--ex-focus)', hex:'#B0A794' }
};
/* 专项训练的身体部位 */
const FOCUS_PARTS = {
  shoulder: { name:'肩背', color:'#3F7A5C' },
  core:     { name:'核心', color:'#6E6A63' },
  glute:    { name:'臀腿', color:'#B0A794' }
};
/* 三种运动卡背后的淡色图标（线性 SVG，64×64） */
const EX_ART = {

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromISO(s); d.setDate(d.getDate()+n); return iso(d); };

function hexRGB(h){
  let s = h.replace('#','');
  if (s.length === 3) s = s.split('').map(c => c+c).join('');
  return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
}
function shade(h, amt){
  const [r,g,b] = hexRGB(h);
  const f = v => Math.max(0, Math.min(255, Math.round(v * (1 + amt))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
/* 点亮态的深一档颜色（--cd）：颜色写的是 CSS 变量时 shade() 算不了，
   交给浏览器用 color-mix 现算，效果和 shade(-0.14) 一致 */
const cdOf = c => /^#/.test(c) ? shade(c, -0.14) : `color-mix(in srgb, ${c}, #000 14%)`;

        /* 这张卡以前叫「睡眠」，现在同时记体重，统一改名「状态」；
           运动卡的点亮色改成深绿（var(--ex-done)），旧设备存过旧色的也一起刷过来 */
        let dirty = false;

          if (t.id === 'exercise' && t.color !== 'var(--ex-done)'){ dirty = true; return { ...t, color:'var(--ex-done)' }; }
          return t;

/* 学习日报只留自己手动记的那些；外部工具写的日报一律不复制、不落库（要用时现读现算） */
function loadReports(){
  const raw = loadJSON(KEY_REPORTS);
  const out = {};
  let dropped = 0;
  Object.keys(raw).forEach(kind => {
    const days = raw[kind];
    if (!days || typeof days !== 'object'){ dropped++; return; }
    const keep = {};
    Object.keys(days).forEach(date => {
      const r = days[date];
      if (r && typeof r === 'object' && r.source !== 'tool') keep[date] = r;
      else dropped++;
    });
    if (Object.keys(keep).length) out[kind] = keep;
  });
  // 之前版本存过的工具副本，顺手清掉，别留在浏览器里
  if (dropped){
    try{ localStorage.setItem(KEY_REPORTS, JSON.stringify(out)); }catch(e){}
  }
  return out;
}

const logOf = (date, id) => (state.logs[date] || {})[id] || null;

function setLog(date, id, val){
  const day = state.logs[date] || (state.logs[date] = {});
  if (val == null) delete day[id]; else day[id] = val;
  if (!Object.keys(day).length) delete state.logs[date];
  // 有了明细就以明细为准，清掉旧的二元打卡标记
  const rec = state.recs[date];
  if (rec && rec[id]){
    delete rec[id];
    if (!Object.keys(rec).length) delete state.recs[date];
    saveRecs();
  }
  saveLogs();
}

/* 时长计算：起床早于入睡视为跨过午夜 */
function durationMin(bed, wake){
  if (!bed || !wake) return null;
  const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
  let m = toMin(wake) - toMin(bed);
  if (m < 0) m += 1440;
  return m > 0 ? m : null;
}
function fmtDur(min){
  if (min == null) return '';
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return `${m} 分钟`;
  return m ? `${h} 小时 ${m} 分` : `${h} 小时`;
}
const sleepLog = date => logOf(date, 'sleep');
const sleepMinOf = date => { const l = sleepLog(date); return l && l.bed && l.wake ? durationMin(l.bed, l.wake) : null; };

/* ---------------- 完成判定 ---------------- */
function isDone(date, id){
  if (id === 'water'){
    if (logOf(date, 'water')) return cupsOf(date) >= WATER_GOAL;
  } else if (id === 'sleep'){
    if (sleepLog(date)) return (sleepMinOf(date) || 0) >= SLEEP_GOAL_MIN;
  } else if (id === 'exercise'){
    if (logOf(date, 'exercise')) return exerciseMinOf(date) > 0;
  } else if (id === 'language' || id === 'english'){
    const r = reportOf(date, id);
    if (r && r.done) return true;   // 外部工具同步来的日报说完成就算点亮；否则照普通任务打卡
  }
  return !!(state.recs[date] && state.recs[date][id]);   // 普通任务 & 旧记录
}

/* 连续天数：从指定日期往前数 */
function streak(id, date){
  let n = 0, cur = date;
  if (!isDone(cur, id)) cur = addDays(cur, -1);
  while (isDone(cur, id)){ n++; cur = addDays(cur, -1); }
  return n;
}

function relLabel(date){
  const diff = Math.round((fromISO(date) - fromISO(todayISO())) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '明天';
  if (diff === -1) return '昨天';
  if (diff === 2) return '后天';
  if (diff === -2) return '前天';
  return diff > 0 ? `${diff} 天后` : `${-diff} 天前`;
}

  return true;
}
function removeExpense(date, id){
  state.expenses[date] = (state.expenses[date] || []).filter(x => x.id !== id);
  if (!state.expenses[date].length) delete state.expenses[date];
  saveExpenses();
}
function expenseTotal(date){
  return (state.expenses[date] || []).reduce((s, x) => s + x.amount, 0);
}
/* 老账没有 cat 或用的是旧 id：归一化一次，只用于展示与统计，不改写原数据 */
function guessExpCat(text){
  const s = String(text || '');
  if (/(红包|份子|礼金|送礼|礼物|请客|生日|随礼|人情|孝敬|给爸|给妈|转账)/.test(s)) return 'social';
  if (/(电影|游戏|演出|门票|ktv|酒吧|旅行|旅游|演唱会|展览|桌游|会员|剧本杀|密室)/i.test(s)) return 'fun';
  if (/(衣|鞋|裤|包|帽|护肤|化妆|数码|耳机|电器|家具|网购|淘宝|京东|拼多多|买的|买了)/.test(s)) return 'shop';
  if (/(饭|餐|外卖|咖啡|奶茶|饮料|水果|菜|面|粉|火锅|烧烤|零食|吃|喝|食堂|酒|超市)/.test(s)) return 'food';
  return 'life';
}
function expCatOf(x){
  if (!x) return 'life';
  const raw = x.cat;
  if (raw && EXP_CAT_MAP[raw]) return raw;
  if (raw && LEGACY_CAT[raw]) return LEGACY_CAT[raw];
  return guessExpCat(x.reason);
}
const money = n => '¥' + n.toFixed(2);

/* 每日一句：同一天始终同一条 */
function dailyQuote(date){
  let h = 2166136261;
  for (let i = 0; i < date.length; i++){
    h ^= date.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ES_QUOTES[(h >>> 0) % ES_QUOTES.length];
}

function tileView(id, date, done){
  if (id === 'water'){
    const c = cupsOf(date);
    const bars = Array.from({ length: WATER_GOAL }, (_, i) => `<i class="${i < c ? 'on' : ''}"></i>`).join('');
    const ml = c * WATER_CUP_ML;
    return {
      extra: `<span class="wbar">${bars}</span>`,
      meta: `<span class="tm-row"><span><b>${c}/${WATER_GOAL}</b> 杯</span>${c > 0 ? '<button class="wminus" data-minus aria-label="减一杯">−</button>' : ''}</span>
             <span class="tm2">${ml ? ml.toLocaleString() + ' ml' : '点一下 +200ml'}</span>`
    };
  }
  if (id === 'sleep'){
    const l = sleepLog(date), min = sleepMinOf(date), kg = weightOf(date);
    const kgTxt = kg != null ? `${fmtKg(kg)} kg` : '';
    if (l && min != null){
      const ok = min >= SLEEP_GOAL_MIN;
      return { meta: `<span class="tm-time">${l.bed}–${l.wake}</span><span class="tm2 ${ok ? 'ok' : 'no'}">${fmtDurShort(min)}${kgTxt ? ' · ' + kgTxt : ''}</span>` };
    }
    if (kgTxt){
      return { meta: `<span class="tm-time">${kgTxt}</span><span class="tm2">睡眠未记录</span>` };
    }
    return { meta: done
      ? `<b>已打卡</b><span class="tm2">点开补填时间</span>`
      : `<b>未记录</b><span class="tm2">点开记睡眠 / 体重</span>` };
  }
  if (id === 'exercise'){
    const l = logOf(date, 'exercise'), m = exerciseMinOf(date);
    if (!l || !m) return { meta: `<b>未记录</b><span class="tm2">点开记录运动</span>` };
    const kind = l.kind || 'function';
    let sub = '功能训练';
    if (kind === 'cardio'){
      const c = l.cardio || {};
      sub = [c.type || '有氧', c.hr ? `${c.hr}bpm` : ''].filter(Boolean).join(' · ');
    } else if (kind === 'focus'){
      const parts = ((l.focus && l.focus.parts) || []).map(p => FOCUS_PARTS[p] && FOCUS_PARTS[p].name).filter(Boolean);
      sub = parts.length ? parts.join(' · ') : '专项训练';
    }
    return { meta: `<b>${m}</b> 分钟<span class="tm2">${esc(sub)}</span>` };
  }
  if (id === 'language' || id === 'english'){
    const r = reportOf(date, id);
    if (r && (r.done || r.minutes || r.items)){
      const main = r.minutes ? `<b>${r.minutes}</b> 分钟` : (r.done ? '<b>已完成</b>' : '<b>未完成</b>');
      return { meta: `${main}<span class="tm2">${r.source === 'manual' ? '手动记录' : '已同步'}</span>` };
    }
    const st = streak(id, date);
    return { meta: st >= 2 ? `🔥 连续 ${st} 天` : (done ? '已完成' : '待打卡') };
  }
  const st = streak(id, date);
  return { meta: st >= 2 ? `🔥 连续 ${st} 天` : (done ? '已完成' : '待打卡') };
}
