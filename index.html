/* =========================================================
   周报：全部本地计算，不联网
   ========================================================= */
const clampPct = x => Math.max(0, Math.min(100, Math.round((x || 0) * 100)));
const pctStr = x => clampPct(x) + '%';
const pctRaw = x => Math.round((x || 0) * 100) + '%';

/* '23:48' → 1428；'01:20' → 1520（凌晨算作前一天深夜，方便比较早晚） */
function clockToMin(t){
  if (!t) return null;
  const [h, m] = String(t).split(':').map(Number);
  if (!isFinite(h) || !isFinite(m)) return null;
  return (h < 12 ? h + 24 : h) * 60 + m;
}
function fmtClock(min){
  if (min == null || !isFinite(min)) return '—';
  const x = ((Math.round(min) % 1440) + 1440) % 1440;
  return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
}
const avgOf = arr => arr.length ? Math.round(arr.reduce((s, x) => s + x, 0) / arr.length) : 0;
const wdOf = date => WEEK_CN[fromISO(date).getDay()];
function isoWeekNo(date){
  const d = fromISO(date);
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - dow + 3);
  const firstThu = new Date(t.getFullYear(), 0, 4);
  const f = (firstThu.getDay() + 6) % 7;
  firstThu.setDate(firstThu.getDate() - f + 3);
  return 1 + Math.round((t - firstThu) / 604800000);
}
const mdLabel = date => { const d = fromISO(date); return `${d.getMonth() + 1} 月 ${d.getDate()} 日`; };

function buildWeeklyReport(weekStart){
  const start = weekStart || startOfWeek(state.cursor);
  const end   = addDays(start, 6);
  const today = todayISO();
  const tasks = state.tasks;
  const N = tasks.length || 1;

  const days = [...Array(7)].map((_, i) => {
    const date = addDays(start, i);
    const future = date > today;
    return { date, future, done: future ? 0 : doneCount(date), isToday: date === today };
  });
  const past = days.filter(d => !d.future);
  const pastDays = past.length;

  /* —— 完成率 —— */
  const doneSum = past.reduce((s, d) => s + d.done, 0);
  const totalSlots = pastDays * N;
  const rate = totalSlots ? doneSum / totalSlots : 0;

  /* —— 睡眠 —— */
  const bedMins = [], wakeMins = [], durMins = [];
  past.forEach(d => {
    const min = sleepMinOf(d.date);
    if (min == null) return;
    const l = sleepLog(d.date);
    durMins.push(min);
    bedMins.push(clockToMin(l.bed));
    wakeMins.push(clockToMin(l.wake));
  });
  const sleep = {
    n: durMins.length,
    avg: avgOf(durMins),
    okDays: durMins.filter(v => v >= SLEEP_GOAL_MIN).length,
    bedAvg: avgOf(bedMins),
    wakeAvg: avgOf(wakeMins),
    /* 折线图用：每天入睡 / 起床时刻，缺失为 null */
    series: days.map(d => {
      if (d.future) return { date:d.date, future:true, bed:null, wake:null };
      const l = sleepLog(d.date);
      if (!l || !l.bed || !l.wake) return { date:d.date, future:false, bed:null, wake:null };
      return { date:d.date, future:false, bed:clockToMin(l.bed), wake:clockToMin(l.wake) };
    })
  };

  /* —— 喝水 —— */
  let waterOk = 0, waterCups = 0;
  past.forEach(d => {
    const c = cupsOf(d.date);
    waterCups += c;
    if (c >= WATER_GOAL) waterOk++;
  });

  /* —— 运动 —— */
  const ex = { n: 0, minutes: 0, kinds: { cardio: 0, function: 0, focus: 0 }, parts: {},
               kindMin: { cardio: 0, function: 0, focus: 0 }, days: [] };
  days.forEach(d => {
    if (d.future){ ex.days.push({ date:d.date, future:true, minutes:0, kind:null }); return; }
    const l = logOf(d.date, 'exercise');
    if (!l || !(l.minutes > 0)){ ex.days.push({ date:d.date, future:false, minutes:0, kind:null }); return; }
    const k = EX_KINDS[l.kind] ? l.kind : 'function';
    ex.n++;
    ex.minutes += l.minutes;
    ex.kinds[k]++;
    ex.kindMin[k] += l.minutes;
    ex.days.push({ date:d.date, future:false, minutes:l.minutes, kind:k });
    if (k === 'focus' && l.focus && Array.isArray(l.focus.parts))
      l.focus.parts.forEach(p => { ex.parts[p] = (ex.parts[p] || 0) + 1; });
  });
  const partGap = {};
  Object.keys(FOCUS_PARTS).forEach(p => {
    partGap[p] = null;
    for (let i = 0; i < 90; i++){
      const l = logOf(addDays(today, -i), 'exercise');
      if (l && l.kind === 'focus' && l.focus && Array.isArray(l.focus.parts) && l.focus.parts.includes(p)){
        partGap[p] = i; break;
      }
    }
  });

  /* —— 支出 —— */
  const bills = [];
  past.forEach(d => (state.expenses[d.date] || []).forEach(x => bills.push({ ...x, date: d.date, cat: expCatOf(x) })));
  const moneyTotal = bills.reduce((s, x) => s + x.amount, 0);
  const byCat = EXP_CATS.map(c => {
    const amount = bills.filter(x => x.cat === c.id).reduce((s, x) => s + x.amount, 0);
    return { id: c.id, name: c.name, color: c.color, hex: c.hex, amount, pct: moneyTotal ? amount / moneyTotal : 0 };
  }).filter(c => c.amount > 0).sort((a, b) => b.amount - a.amount);
  const moneyRpt = {
    count: bills.length,
    total: moneyTotal,
    daily: pastDays ? moneyTotal / pastDays : 0,
    max: bills.slice().sort((a, b) => b.amount - a.amount)[0] || null,
    /* 迷你柱用：每天开销，未到的日子为 0 */
    days: days.map(d => ({ date: d.date, future: d.future, amount: d.future ? 0 : expenseTotal(d.date) })),
    byCat
  };

  /* —— 体重（和睡眠同记在「状态」卡里） —— */
  const kgs = [];
  past.forEach(d => {
    const v = weightOf(d.date);
    if (v != null) kgs.push({ date: d.date, kg: v });
  });
  const weight = {
    n: kgs.length,
    avg: kgs.length ? kgs.reduce((s, x) => s + x.kg, 0) / kgs.length : null,
    first: kgs.length ? kgs[0].kg : null,
    last: kgs.length ? kgs[kgs.length - 1].kg : null
  };

  /* —— 每周任务 / 待办 —— */
  const wk = start;
  const weeklyDone = weeklyDoneCount(wk);
  const todos = todosOf(wk);
  const todoDone = todos.filter(t => t.done).length;

  /* —— 理财：本周所有基金的收益合计 + 平均收益率 —— */
  const fin = financeStats(wk);

  const r = {
    start, end, weekNo: isoWeekNo(start), pastDays, tasks: N,
    days, doneSum, totalSlots, rate,
    sleep, weight, water: { okDays: waterOk, cups: waterCups },
    ex, partGap, money: moneyRpt, finance: fin,
    weekly: { done: weeklyDone, total: WEEKLY_TASKS.length },
    todos: { done: todoDone, total: todos.length },
    isCurrent: start === startOfWeek(today)
  };
  r.summary = makeSummary(r);
  return r;
}

function makeSummary(r){
  if (!r.pastDays) return '这一周还没开始。';
  if (!r.doneSum && !r.sleep.n && !r.money.total) return '这周没有留下记录。';
  const seg = [];
  seg.push(`${r.tasks} 项任务点亮 ${r.doneSum} 次，完成率 ${pctStr(r.rate)}`);
  if (r.sleep.n) seg.push(`睡眠均值 ${fmtDur(r.sleep.avg)}，${r.sleep.okDays} 天达标`);
  if (r.ex.n)    seg.push(`运动 ${r.ex.n} 次共 ${r.ex.minutes} 分钟`);
  else           seg.push('这周没有运动记录');
  if (r.money.total > 0) seg.push(`支出 ${money(r.money.total)}`);
  return seg.slice(0, 3).join('；') + '。';
}

/* =========================================================
   周报：渲染 / 导出（全部本地，图片也是本地画）
   ========================================================= */
const fmtDurShort = m => m ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : '—';
const moneyShort = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const moneySmart = n => Number.isInteger(n) ? '¥' + n.toLocaleString('zh-CN') : '¥' + n.toFixed(2);
const reportTitle = r => r.isCurrent ? '本周周报' : `第 ${r.weekNo} 周周报`;
const EX_HEX = k => IMG_EX[k] || IMG.ink3;   // 长图专用取色（Bottega Green）
const SLEEP_BED = 'var(--sleep-bed)', SLEEP_WAKE = 'var(--sleep-wake)';

/* 大号数字的首字左侧留白比小字标题宽（“1”最明显），按首字补一点负边距，
   这样「运动 / 160分钟 / 4次」三行的左边缘才看起来在一条线上（¥ 本身贴边，不动） */
function numLeftShift(txt){
  const c = String(txt).trim().charAt(0);
  if (c === '1') return -1.5;   /* “1” 的字形最窄，左侧留白最大，要多补一点 */
  return 0;                     /* 其它数字、¥ 基本贴边，不动 */
}

function paintReportCard(){
  const r = buildWeeklyReport(startOfWeek(state.cursor));
  const s = fromISO(r.start), e = fromISO(r.end);
  $('wrCardTitle').textContent = reportTitle(r);
  $('wrCardSub').textContent = `${s.getMonth() + 1}.${s.getDate()} – ${e.getMonth() + 1}.${e.getDate()}`;
  $('wrCardSum').textContent = r.summary;
}

/* 通用圆环：parts = [{ value, color }]，不显示具体数值 */
function donutSVG(parts, size, thick, center){
  const r = (size - thick) / 2, C = 2 * Math.PI * r;
  const total = parts.reduce((s, p) => s + (p.value > 0 ? p.value : 0), 0);
  const base = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bar-track)" stroke-width="${thick}"/>`;
  let acc = 0;
  const arcs = total > 0 ? parts.filter(p => p.value > 0).map(p => {
    const len = p.value / total * C;
    const gap = Math.min(2.6, len * .28);
    const dash = Math.max(.5, len - gap);
    const s = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${thick}"
      stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-acc}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>`;
    acc += len;
    return s;
  }).join('') : '';
  return `<div class="rp-donut" style="--sz:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${base}${arcs}</svg>
    ${center ? `<div class="rp-donut-c">${center}</div>` : ''}
  </div>`;
}

function exParts(r){
  return Object.keys(EX_KINDS).map(k => ({
    key: k, name: EX_KINDS[k].name, hex: IMG_EX[k] || IMG.ink3,
    color: `var(--ex-${k})`, value: r.ex.kindMin[k]
  }));
}
const catParts = r => r.money.byCat.map(c => ({ key:c.id, name:c.name, hex:IMG_CAT[c.id] || IMG.ink3, color:c.color, value:c.amount, pct:c.pct }));

/* 睡眠：每天一根竖条（上=入睡，下=起床），DOM 与 Canvas 共用这套时间轴换算 */
function sleepSeriesPts(r){
  const axis = t => (t < 12 * 60 ? t + 1440 : t);   // 中午之前的时刻 +24h 才连续
  return r.sleep.series.map(s => {
    if (s.bed == null || s.wake == null) return null;
    const bed = axis(s.bed);
    let wake = axis(s.wake);
    if (wake <= bed) wake += 1440;                    // 起床反而更早，说明跨过了中午
    return { bed, wake };
  });
}
function sleepChartSVG(r){
  const pts = sleepSeriesPts(r);
  const vals = [];
  pts.forEach(p => { if (p) vals.push(p.bed, p.wake); });
  if (!vals.length) return '<div class="rp-empty">这周还没有睡眠记录。</div>';

  const W = 345, H = 272, L = 48, R = 4, T = 10, B = 22;
  const LAB = L - 22;                                  // 时间轴文字右对齐点，与柱子之间留 ~15 的缝
  const lo = Math.floor((Math.min(23 * 60, ...vals) - 40) / 60) * 60;
  const hi = Math.ceil((Math.max(9 * 60 + 1440, ...vals) + 40) / 60) * 60;
  const X = i => L + i * (W - L - R) / 6;
  const Y = v => T + (v - lo) / (hi - lo) * (H - T - B);

  let grid = '';
  for (let t = Math.ceil(lo / 180) * 180; t <= hi; t += 180){
    const gy = Y(t).toFixed(1);
    grid += `<line class="grid" x1="${L}" y1="${gy}" x2="${W - R}" y2="${gy}"/>`
          + `<text x="${LAB}" y="${(Number(gy) + 2.9).toFixed(1)}" text-anchor="end">${fmtClock(t)}</text>`;
  }

  const BW = 13;                                       // 竖条宽度，胶囊形
  const bars = pts.map((p, i) => {
    if (!p) return '';
    const top = Y(p.bed), bot = Y(p.wake);
    const y = Math.min(top, bot), h = Math.max(BW, Math.abs(bot - top));
    return `<rect x="${(X(i) - BW / 2).toFixed(1)}" y="${y.toFixed(1)}"
              width="${BW}" height="${h.toFixed(1)}" rx="${BW / 2}" fill="url(#slGrad)"/>`;
  }).join('');

  const xs = r.sleep.series.map((s, i) =>
    `<text x="${X(i).toFixed(1)}" y="${H - 5}" text-anchor="middle"${s.future ? ' opacity=".45"' : ''}>${WEEK_CN[fromISO(s.date).getDay()].replace('周','')}</text>`).join('');

  return `<svg class="rp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每天睡眠时段：一根竖条表示当天入睡到起床">
      <defs><linearGradient id="slGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${SLEEP_BED}"/>
        <stop offset="1" stop-color="${SLEEP_WAKE}"/>
      </linearGradient></defs>
      ${grid}${bars}${xs}
    </svg>`;
}

/* 运动：每天时长柱 ｜ 圆环 + 图例 */
function exDetail(r){
  const parts = exParts(r), total = parts.reduce((s, p) => s + p.value, 0);
  if (!total) return '<div class="rp-empty">这周还没有运动记录。</div>';
  const max = Math.max(30, ...r.ex.days.map(d => d.minutes));
  const H = 105, TOP = 13;                                  /* 与 CSS 的 105 高、上方留 13 给数值一致 */
  const bars = r.ex.days.map(d => d.minutes
    ? `<div class="d" style="--h:${Math.round((H - TOP) * d.minutes / max)}px;--k:var(--ex-${d.kind})">
         <em>${d.minutes}</em><i></i></div>`
    : `<div class="d"><em></em><i class="none" style="background:transparent;height:3px"></i></div>`).join('');
  const xs = r.days.map(d =>
    `<span${d.future ? ' style="opacity:.45"' : ''}>${WEEK_CN[fromISO(d.date).getDay()].replace('周','')}</span>`).join('');
  const rows = parts.map(p =>
    `<div class="row"><i style="--lc:${p.color}"></i>${p.name}<em>${pctStr(p.value / total)}</em></div>`).join('');
  return `<div class="rp-ex">
    <div class="rp-ex-main">
      <div class="rp-ex-b">${bars}</div>
      <div class="rp-ex-x">${xs}</div>
    </div>
    <div class="rp-ex-side">
      ${donutSVG(parts, 44, 7, '')}
      <div class="rp-legend">${rows}</div>
    </div>
  </div>`;
}

/* 支出：分类横条，以最大一类为满格 */
function moneyDetail(r){
  if (!r.money.byCat.length) return '<div class="rp-empty">这周还没有记账。</div>';
  const max = Math.max(...r.money.byCat.map(c => c.amount)) || 1;
  return `<div class="rp-cats">${r.money.byCat.map(c => `
    <div class="rp-cat">
      <span class="nm">${c.name}</span>
      <span class="tk"><i style="--w:${Math.max(4, Math.round(c.amount / max * 100))}%;--kc:${c.color}"></i></span>
      <span class="vl">${moneySmart(c.amount)}<em>${pctStr(c.pct)}</em></span>
    </div>`).join('')}</div>`;
}

/* ---------------- 整张 A5（横版）的 DOM ---------------- */
function reportHTML(r){
  const s = fromISO(r.start), e = fromISO(r.end);
  const durTxt = fmtDurShort(r.sleep.avg);
  const durShift = numLeftShift(durTxt);
  const exShift = numLeftShift(String(r.ex.minutes));
  const moneyShift = numLeftShift(moneyShort(r.money.total));

  /* 状态 */
  const kgB = r.weight.avg != null
    ? `<b>${fmtKg(r.weight.avg)}</b><span>kg</span>`
    : `<b style="color:var(--ink-3)">—</b>`;

  /* 理财 */
  const fin = r.finance;
  const finTone = fin.n ? (fin.profit > 0 ? ' up' : fin.profit < 0 ? ' down' : '') : '';
  const finVal = fin.n ? fmtProfit(fin.profit) : '—';
  const finRate = fin.rate == null ? '—' : fmtRate(fin.rate);

  /* 七天完成率 */
  const bars = r.days.map(d => {
    if (d.future) return `<div class="d off"><i></i></div>`;
    const p = Math.round(d.done / r.tasks * 100);
    return `<div class="d${d.done === r.tasks ? ' full' : ''}${d.isToday ? ' today' : ''}"
              style="--h:${Math.max(10, p)}%"><i></i></div>`;
  }).join('');
  const barsX = r.days.map(d =>
    `<span class="${d.isToday ? 'today' : ''}">${WEEK_CN[fromISO(d.date).getDay()].replace('周', '')}</span>`).join('');

  /* 运动 / 支出的第三行：日均 + 单日最高 */
  const exMaxDay = Math.max(0, ...r.ex.days.map(d => d.minutes));
  const exDayAvg = Math.round(r.ex.minutes / Math.max(1, r.pastDays));
  const moMaxBill = r.money.max ? moneyShort(r.money.max.amount) : '—';

  const sleepHead = r.sleep.n
    ? `<i style="--lc:var(--sleep-bed)"></i>入睡 ${fmtClock(r.sleep.bedAvg)}
       <i style="--lc:var(--sleep-wake);margin-left:8px"></i>起床 ${fmtClock(r.sleep.wakeAvg)}`
    : '';

  return `
  <div class="rp-top">
    <div class="rp-head">
      <div class="rp-kick">${s.getFullYear()} 年 ${mdLabel(r.start)} – ${mdLabel(r.end)} · 第 ${r.weekNo} 周</div>
      <h1 class="rp-title">${reportTitle(r)}<em>${clampPct(r.rate)}%</em></h1>

      <div class="rp-tiles">
        <div class="rp-tile">
          <div class="rp-tile-l"><span>状态</span><em>${r.sleep.n ? `达标 ${r.sleep.okDays}/${r.sleep.n} 天` : '无记录'}</em></div>
          <div class="rp-tile-row"><div class="rp-tile-v" style="margin-left:${durShift}px">${durTxt}</div></div>
          <div class="rp-tile-b"><span>平均体重</span>${kgB}<span class="r">${r.weight.n ? `${r.weight.n} 天` : '—'}</span></div>
        </div>
        <div class="rp-tile">
          <div class="rp-tile-l"><span>理财</span><em>${fin.n ? `${fin.n} 笔` : '无记录'}</em></div>
          <div class="rp-tile-row"><div class="rp-tile-v${finTone}">${finVal}</div></div>
          <div class="rp-tile-b"><span>平均收益率</span><b>${finRate}</b>
            <span class="r">${fin.n ? `本金 ${moneyShort(fin.principal)}` : '—'}</span></div>
        </div>
        <div class="rp-tile">
          <div class="rp-tile-l"><span>运动</span><em>${r.ex.n ? `${r.ex.n} 次` : '无记录'}</em></div>
          <div class="rp-tile-row"><div class="rp-tile-v" style="margin-left:${exShift}px">${r.ex.minutes}<span>分钟</span></div></div>
          <div class="rp-tile-b"><span>日均</span><b>${exDayAvg}</b><span>分钟</span>
            <span class="r">${r.ex.n ? `单日最多 ${exMaxDay} 分钟` : '—'}</span></div>
        </div>
        <div class="rp-tile">
          <div class="rp-tile-l"><span>支出</span><em>${r.money.count ? `${r.money.count} 笔` : '无记录'}</em></div>
          <div class="rp-tile-row"><div class="rp-tile-v" style="margin-left:${moneyShift}px">${moneyShort(r.money.total)}</div></div>
          <div class="rp-tile-b"><span>日均</span><b>${moneyShort(r.money.daily)}</b>
            <span class="r">${r.money.max ? `单笔最大 ${moMaxBill}` : '—'}</span></div>
        </div>
      </div>

      <div class="rp-days">
        <div class="rp-days-h"><span>每天完成率</span><span>${r.tasks} 项 · 共点亮 ${r.doneSum} 次</span></div>
        <div class="rp-days-b">${bars}</div>
        <div class="rp-days-x">${barsX}</div>
      </div>
    </div>

    <section class="rp-sec">
      <div class="rp-sec-h"><h3>睡眠</h3><span>${sleepHead}</span></div>
      ${sleepChartSVG(r)}
    </section>
  </div>

  <div class="rp-bottom">
    <section class="rp-sec">
      <div class="rp-sec-h"><h3>运动</h3><span>${r.ex.n ? `共 ${r.ex.minutes} 分钟` : '—'}</span></div>
      ${exDetail(r)}
    </section>

    <section class="rp-sec">
      <div class="rp-sec-h"><h3>支出</h3><span>${r.money.count ? `日均 ${moneyShort(r.money.daily)}` : '—'}</span></div>
      ${moneyDetail(r)}
    </section>
  </div>`;
}

/* =========================================================
   导出 PDF：同一张 A5 用 Canvas 重画（300dpi），再手写单页 PDF
   —— 走偏浅色的一套固定配色，在哪儿看都一样
   ========================================================= */
const IMG = {
  bg:'#EFEBDF', card:'#F9F7F0', line:'#DED7C5', track:'#E6E0D0', off:'#D2C9B4', mid:'#B3B0A2',
  ink:'#191E1A', ink2:'#4A554C', ink3:'#8E9789',
  green:'#3D7A4C', red:'#93452F', bed:'#2A3B2E',
  accent:'#2E5233', wake:'#5F9269'
};
/* 分类 / 运动的取色单独一套，不去改 EXP_CATS.hex —— 那套 hex 还被记账弹层用着 */
const IMG_CAT = { food:'#2E5233', life:'#1C1C1C', fun:'#93A588', shop:'#5F9269', social:'#B3A98C' };
const IMG_EX  = { cardio:'#2E5233', function:'#1C1C1C', focus:'#5F9269' };
const IMG_FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif';

/* A5 横版版面（单位 px，1mm = 3.7795px）；下面每一块的高度与 CSS 严格对应 */
const A5W = 793.7, A5H = 559.37;
const PADX = 22, PADY = 22, CW = A5W - PADX * 2;   /* 749.7 */
const TILE_H = 96, TILE_GAP = 8;
const TOP_LW = 380, TOP_GAP = 24;                   /* 上半区左列宽 / 列间距 */
const TOP_RX = PADX + TOP_LW + TOP_GAP;             /* 右列（睡眠）起点 448 */
const BOT_W = (CW - TOP_GAP) / 2;                   /* 下半区每栏 361.85 */
const SLEEP_DROP = 58;                              /* 睡眠段头下移量，与 CSS 的 58 一致 */

function imgText(ctx, s, x, y, size, weight, color, align){
  ctx.font = `${weight} ${size}px ${IMG_FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
  ctx.textAlign = 'left';
}
function imgWidth(ctx, s, size, weight){
  ctx.font = `${weight} ${size}px ${IMG_FONT}`;
  return ctx.measureText(s).width;
}
function imgRound(ctx, x, y, w, h, r){
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function imgDonut(ctx, cx, cy, size, thick, parts){
  const r = (size - thick) / 2, C = 2 * Math.PI * r;
  const total = parts.reduce((s, p) => s + (p.value > 0 ? p.value : 0), 0);
  ctx.lineWidth = thick;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = IMG.track; ctx.stroke();
  if (!total) return;
  let acc = 0;
  parts.filter(p => p.value > 0).forEach(p => {
    const len = p.value / total * C;
    const gap = Math.min(2.2, len * .28);
    const dash = Math.max(.5, len - gap);
    const a0 = -Math.PI / 2 + acc / r;
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, a0 + dash / r);
    ctx.strokeStyle = p.hex;
    ctx.stroke();
    acc += len;
  });
}

function buildReportCanvas(r){
  const K = 2480 / A5W;                       /* A5 @ 300dpi = 2480 × 1748 */
  const cv = document.createElement('canvas');
  cv.width = Math.round(A5W * K);
  cv.height = Math.round(A5H * K);
  const ctx = cv.getContext('2d');
  ctx.scale(K, K);
  ctx.fillStyle = IMG.bg; ctx.fillRect(0, 0, A5W, A5H);
  ctx.lineCap = 'butt';

  const X = PADX;
  let y = PADY;

  /* ---- 抬头（只占左列宽） ---- */
  const s0 = fromISO(r.start);
  imgText(ctx, `${s0.getFullYear()} 年 ${mdLabel(r.start)} – ${mdLabel(r.end)} · 第 ${r.weekNo} 周`,
          X, y + 9.7, 10, 700, IMG.ink3);
  y += 12 + 3;

  const title = reportTitle(r);
  imgText(ctx, title, X, y + 23, 27, 800, IMG.ink);
  const tw = imgWidth(ctx, title, 27, 800);
  imgText(ctx, `${clampPct(r.rate)}%`, X + tw + 9, y + 23, 15, 750, IMG.accent);
  y += 32;                                     /* DOM 实测：27px 标题行盒 32 高 */

  /* ---- 四格：2×2（左列） ---- */
  y += 11;
  const TW = (TOP_LW - TILE_GAP) / 2;

  const tile = (cx, cy, cw, t) => {
    ctx.fillStyle = IMG.card;
    imgRound(ctx, cx, cy, cw, TILE_H, 10); ctx.fill();
    ctx.strokeStyle = IMG.line; ctx.lineWidth = 1;
    imgRound(ctx, cx + .5, cy + .5, cw - 1, TILE_H - 1, 10); ctx.stroke();

    const px = cx + 13;
    imgText(ctx, t.label, px, cy + 21, 10, 700, IMG.ink3);
    if (t.em) imgText(ctx, t.em, cx + cw - 13, cy + 21, 10, 650, IMG.ink3, 'right');

    const vx = px + (t.shift || 0);
    imgText(ctx, t.value, vx, cy + 48.5, 24, 800, t.color || IMG.ink);
    if (t.unit){
      const vw = imgWidth(ctx, t.value, 24, 800);
      imgText(ctx, t.unit, vx + vw + 4, cy + 48.5, 10.5, 700, IMG.ink3);
    }

    imgText(ctx, t.bLabel, px, cy + 82.5, 9.5, 650, IMG.ink3);
    const lw = imgWidth(ctx, t.bLabel, 9.5, 650);
    imgText(ctx, t.bValue, px + lw + 5, cy + 83, 13.5, 800, IMG.ink);
    if (t.bUnit){
      const bw = imgWidth(ctx, t.bValue, 13.5, 800);
      imgText(ctx, t.bUnit, px + lw + 5 + bw + 4, cy + 83, 9.5, 700, IMG.ink3);
    }
    if (t.right) imgText(ctx, t.right, cx + cw - 13, cy + 82.5, 9.5, 650, IMG.ink3, 'right');
  };

  const row2 = y + TILE_H + TILE_GAP;
  const durTxt = fmtDurShort(r.sleep.avg);
  tile(X, y, TW, {
    label:'状态', em: r.sleep.n ? `达标 ${r.sleep.okDays}/${r.sleep.n} 天` : '无记录',
    value: durTxt, shift: numLeftShift(durTxt),
    bLabel:'平均体重', bValue: r.weight.avg != null ? fmtKg(r.weight.avg) : '—',
    bUnit: r.weight.avg != null ? 'kg' : '',
    right: r.weight.n ? `${r.weight.n} 天` : '—'
  });
  const fin = r.finance;
  tile(X + TW + TILE_GAP, y, TW, {
    label:'理财', em: fin.n ? `${fin.n} 笔` : '无记录',
    value: fin.n ? fmtProfit(fin.profit) : '—',
    color: !fin.n ? IMG.ink3 : fin.profit > 0 ? IMG.green : fin.profit < 0 ? IMG.red : IMG.ink,
    bLabel:'平均收益率', bValue: fin.rate == null ? '—' : fmtRate(fin.rate),
    right: fin.n ? `本金 ${moneyShort(fin.principal)}` : '—'
  });

  const exMaxDay = Math.max(0, ...r.ex.days.map(d => d.minutes));
  tile(X, row2, TW, {
    label:'运动', em: r.ex.n ? `${r.ex.n} 次` : '无记录',
    value: String(r.ex.minutes), unit:'分钟', shift: numLeftShift(String(r.ex.minutes)),
    bLabel:'日均', bValue: String(Math.round(r.ex.minutes / Math.max(1, r.pastDays))), bUnit:'分钟',
    right: r.ex.n ? `单日最多 ${exMaxDay} 分钟` : '—'
  });
  const moneyTxt = moneyShort(r.money.total);
  tile(X + TW + TILE_GAP, row2, TW, {
    label:'支出', em: r.money.count ? `${r.money.count} 笔` : '无记录',
    value: moneyTxt, shift: numLeftShift(moneyTxt),
    bLabel:'日均', bValue: moneyShort(r.money.daily), bUnit:'',
    right: r.money.max ? `单笔最大 ${moneyShort(r.money.max.amount)}` : '—'
  });

  /* ---- 睡眠（右列，与左列齐高） ---- */
  const sx = TOP_RX;
  const SLEEP_TOP = PADY + SLEEP_DROP;      /* 与四格卡片顶部齐平，与 CSS 的 58 一致 */
  imgText(ctx, '睡眠', sx, SLEEP_TOP + 11, 12, 750, IMG.ink);
  if (r.sleep.n){
    let mx = sx + (CW - TOP_LW - TOP_GAP);
    const wakeTxt = `起床 ${fmtClock(r.sleep.wakeAvg)}`;
    mx -= imgWidth(ctx, wakeTxt, 9.5, 650);
    imgText(ctx, wakeTxt, mx, SLEEP_TOP + 11, 9.5, 650, IMG.ink3);
    const wdot = mx - 7;
    ctx.beginPath(); ctx.arc(wdot, SLEEP_TOP + 8, 3, 0, Math.PI * 2); ctx.fillStyle = IMG.wake; ctx.fill();
    const bedTxt = `入睡 ${fmtClock(r.sleep.bedAvg)}`;
    mx = wdot - 11 - imgWidth(ctx, bedTxt, 9.5, 650);
    imgText(ctx, bedTxt, mx, SLEEP_TOP + 11, 9.5, 650, IMG.ink3);
    ctx.beginPath(); ctx.arc(mx - 7, SLEEP_TOP + 8, 3, 0, Math.PI * 2); ctx.fillStyle = IMG.bed; ctx.fill();
  }
  imgSleepChart(ctx, r, sx, SLEEP_TOP + 19, CW - TOP_LW - TOP_GAP);

  /* ---- 每天完成率（横跨整页） ---- */
  y = row2 + TILE_H;
  y += 14;
  imgText(ctx, '每天完成率', X, y + 9.5, 9.5, 700, IMG.ink3);
  imgText(ctx, `${r.tasks} 项 · 共点亮 ${r.doneSum} 次`, X + TOP_LW, y + 9.5, 9.5, 650, IMG.ink3, 'right');
  y += 13 + 4;

  const barH = 44, bgap = 9, cell = (TOP_LW - 6 * bgap) / 7, bw = 34;
  r.days.forEach((d, i) => {
    const bx = X + i * (cell + bgap) + (cell - bw) / 2;
    if (d.future){
      ctx.save(); ctx.setLineDash([2.5, 3]); ctx.strokeStyle = IMG.off; ctx.lineWidth = 1;
      imgRound(ctx, bx + .5, y + barH - 10, bw - 1, 9.5, 3); ctx.stroke(); ctx.restore();
      return;
    }
    const p = Math.max(.1, d.done / r.tasks);
    const bh = Math.max(3, barH * p);
    imgRound(ctx, bx, y + barH - bh, bw, bh, 3);
    ctx.fillStyle = (d.done === r.tasks || d.isToday) ? IMG.ink : IMG.mid;
    ctx.fill();
  });
  y += barH + 4;
  r.days.forEach((d, i) => {
    imgText(ctx, WEEK_CN[fromISO(d.date).getDay()].replace('周', ''),
            X + i * (cell + bgap) + cell / 2, y + 9, 8.5, 700, d.isToday ? IMG.ink : IMG.ink3, 'center');
  });
  y += 12;

  /* ---- 下半区：运动（左） ｜ 支出（右） ---- */
  y += 14;
  const bx2 = X + BOT_W + TOP_GAP;
  imgText(ctx, '运动', X, y + 10.5, 12, 750, IMG.ink);
  imgText(ctx, r.ex.n ? `共 ${r.ex.minutes} 分钟` : '—', X + BOT_W, y + 10.5, 9.5, 650, IMG.ink3, 'right');
  imgText(ctx, '支出', bx2, y + 10.5, 12, 750, IMG.ink);
  imgText(ctx, r.money.count ? `日均 ${moneyShort(r.money.daily)}` : '—', bx2 + BOT_W, y + 10.5, 9.5, 650, IMG.ink3, 'right');
  y += 19;

  imgExChart(ctx, r, X, y, BOT_W);
  imgMoneyChart(ctx, r, bx2, y, BOT_W);

  return cv;
}

/* 支出：分类横条，返回画完后的 y */
function imgMoneyChart(ctx, r, x, y, w){
  if (!r.money.byCat.length){
    imgText(ctx, '这周还没有记账。', x, y + 16, 10, 650, IMG.ink3);
    return y + 25;
  }
  const ROW = 24;
  const cmax = Math.max(...r.money.byCat.map(c => c.amount)) || 1;
  const amtW = Math.max(...r.money.byCat.map(c => imgWidth(ctx, moneySmart(c.amount), 9.5, 750)));
  const pctW = Math.max(...r.money.byCat.map(c => imgWidth(ctx, pctStr(c.pct), 8, 650)));
  const amtX = x + w - pctW - 4 - amtW;
  const trackX = x + 49, trackW = amtX - 9 - trackX;
  r.money.byCat.forEach((c, i) => {
    const ry = y + i * ROW + 16.5;
    imgText(ctx, c.name, x, ry, 9.5, 700, IMG.ink2);
    imgRound(ctx, trackX, ry - 6.5, trackW, 6, 3); ctx.fillStyle = IMG.track; ctx.fill();
    const bw = Math.max(3, trackW * (c.amount / cmax));
    imgRound(ctx, trackX, ry - 6.5, bw, 6, 3); ctx.fillStyle = IMG_CAT[c.id] || IMG.ink3; ctx.fill();
    imgText(ctx, moneySmart(c.amount), amtX, ry, 9.5, 750, IMG.ink);
    imgText(ctx, pctStr(c.pct), x + w, ry, 8, 650, IMG.ink3, 'right');
  });
  return y + ROW * r.money.byCat.length;
}

/* 睡眠：每天一根竖条，返回画完后的 y */
function imgSleepChart(ctx, r, x, y, w){
  const H = 272, T = 10, B = 22, L = 48;
  const LAB = L - 22;                                  /* 时间轴文字右对齐点，与柱子拉开 */
  const pts = sleepSeriesPts(r);
  const vals = [];
  pts.forEach(p => { if (p) vals.push(p.bed, p.wake); });
  if (!vals.length){
    imgText(ctx, '这周还没有睡眠记录。', x, y + 16, 10, 650, IMG.ink3);
    return y + 25;
  }
  const lo = Math.floor((Math.min(23 * 60, ...vals) - 40) / 60) * 60;
  const hi = Math.ceil((Math.max(9 * 60 + 1440, ...vals) + 40) / 60) * 60;
  const X = i => x + L + i * (w - L - 4) / 6;
  const Y = v => y + T + (v - lo) / (hi - lo) * (H - T - B);

  for (let t = Math.ceil(lo / 180) * 180; t <= hi; t += 180){
    const gy = Y(t);
    ctx.save();
    ctx.setLineDash([2.5, 3.5]); ctx.lineCap = 'butt'; ctx.strokeStyle = IMG.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + L, gy); ctx.lineTo(x + w - 4, gy); ctx.stroke();
    ctx.restore();
    imgText(ctx, fmtClock(t), x + LAB, gy + 2.9, 8.5, 650, IMG.ink3, 'right');
  }

  const BW = 13;
  pts.forEach((p, i) => {
    if (!p) return;
    const top = Y(p.bed), bot = Y(p.wake);
    const by = Math.min(top, bot), bh = Math.max(BW, Math.abs(bot - top));
    const g = ctx.createLinearGradient(0, by, 0, by + bh);   /* 上深（入睡）下浅（起床） */
    g.addColorStop(0, IMG.bed);
    g.addColorStop(1, IMG.wake);
    imgRound(ctx, X(i) - BW / 2, by, BW, bh, BW / 2);
    ctx.fillStyle = g; ctx.fill();
  });

  r.sleep.series.forEach((s, i) => {
    imgText(ctx, WEEK_CN[fromISO(s.date).getDay()].replace('周', ''),
            X(i), y + H - 5, 8.5, 700, s.future ? IMG.off : IMG.ink3, 'center');
  });
  return y + H;
}

/* 运动：每日柱 + 圆环 + 图例，返回画完后的 y */
function imgExChart(ctx, r, x, y, w){
  const parts = exParts(r), total = parts.reduce((s, p) => s + p.value, 0);
  if (!total){
    imgText(ctx, '这周还没有运动记录。', x, y + 16, 10, 650, IMG.ink3);
    return y + 25;
  }
  const sideW = 113, barW = w - sideW - 12;
  const H = 105, bw = (barW - 6 * 6) / 7;
  const max = Math.max(30, ...r.ex.days.map(d => d.minutes));
  r.ex.days.forEach((d, i) => {
    const bx = x + i * (bw + 6);
    if (!d.minutes) return;               /* 未运动那天不画，保持只有三种运动色 */
    const bh = Math.max(3, (H - 13) * (d.minutes / max));
    imgText(ctx, String(d.minutes), bx + bw / 2, y + H - bh - 4, 8, 750, IMG.ink3, 'center');
    imgRound(ctx, bx, y + H - bh, bw, bh, 3);
    ctx.fillStyle = EX_HEX(d.kind || 'function');
    ctx.fill();
  });
  r.days.forEach((d, i) => {
    imgText(ctx, WEEK_CN[fromISO(d.date).getDay()].replace('周', ''),
            x + i * (bw + 6) + bw / 2, y + H + 10, 8, 700, d.future ? IMG.off : IMG.ink3, 'center');
  });

  const dx = x + barW + 12 + 22, dy = y + 82.5;   /* 与柱区（105）底对齐后，圆环在 45 高的侧栏里居中 */
  imgDonut(ctx, dx, dy, 44, 7, parts.map(p => ({ value:p.value, hex:p.hex })));
  const lx = dx + 30;
  let ly = dy - 13.5;
  parts.forEach(p => {
    ctx.beginPath(); ctx.arc(lx + 3, ly - 3, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.hex; ctx.fill();
    imgText(ctx, p.name, lx + 10, ly, 9, 700, IMG.ink2);
    imgText(ctx, pctStr(p.value / total), x + w, ly, 9, 650, IMG.ink3, 'right');
    ly += 17;
  });
  return y + H + 14;
}

/* ---------------- 一个只有一页的 PDF（内嵌 JPEG，无第三方库） ---------------- */
function makePDF(jpegB64, pxW, pxH, mmW, mmH){
  const raw = atob(jpegB64);
  const img = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) img[i] = raw.charCodeAt(i);

  const ptW = +(mmW * 72 / 25.4).toFixed(4);   /* 210mm → 595.2756pt */
  const ptH = +(mmH * 72 / 25.4).toFixed(4);   /* 148mm → 419.5276pt */

  const chunks = []; let size = 0;
  const put = u8 => { chunks.push(u8); size += u8.length; return size; };
  const putStr = s => {
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 0xff;
    return put(u);
  };

  putStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const off = [];
  off[1] = size; putStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2] = size; putStr('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  off[3] = size; putStr(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}]`
    + ` /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n`);
  const content = `q\n${ptW} 0 0 ${ptH} 0 0 cm\n/Im0 Do\nQ\n`;
  off[4] = size; putStr(`4 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
  off[5] = size; putStr(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH}`
    + ` /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);
  put(img);
  putStr('\nendstream\nendobj\n');

  const xrefAt = size;
  let xref = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) xref += String(off[i]).padStart(10, '0') + ' 00000 n \n';
  xref += `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`;
  putStr(xref);

  const out = new Uint8Array(size);
  let p = 0;
  chunks.forEach(c => { out.set(c, p); p += c.length; });
  return new Blob([out], { type: 'application/pdf' });
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* 纸是固定的 210×148mm，窗口多高就缩到多高 —— 永远一页看完 */
function fitReportPage(){
  const page = $('rptBody'), stage = $('rptStage');
  if (!page || !stage) return;
  const bar = document.querySelector('.rpt-bar');
  const availW = (stage.clientWidth || innerWidth) - 20;
  const availH = innerHeight - (bar ? bar.offsetHeight : 0) - 68;   /* 留出提示行 */
  const s = Math.max(.24, Math.min(1.6, Math.min(availW / A5W, availH / A5H)));
  page.style.zoom = s;
  const hint = document.querySelector('.rpt-hint');
  if (hint) hint.textContent = (innerWidth < 560 && innerHeight > innerWidth)
    ? 'A5 横版 · 210 × 148mm · 手机横屏或点「存 PDF」看细节'
    : 'A5 横版 · 210 × 148mm · 点「存 PDF」保存这一页';
}

/* ---------------- 月视图 ---------------- */
function renderMonth(){
  const d = fromISO(state.cursor);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(d.getFullYear(), d.getMonth(), 1 - offset);
  const today = todayISO();
  let html = '';

  for (let row = 0; row < 6; row++){
    const rowStart = new Date(start.getFullYear(), start.getMonth(), start.getDate() + row * 7);
    const wk = iso(rowStart);   // 该行的周一日期，即这一周的 key

    for (let col = 0; col < 7; col++){
      const day = new Date(rowStart.getFullYear(), rowStart.getMonth(), rowStart.getDate() + col);
      const date = iso(day);
      const out = day.getMonth() !== d.getMonth();
      const total = state.tasks.length;
      const done = doneCount(date);
      const all = total > 0 && done === total;
      const cells = state.tasks.map(t =>
        `<i class="${isDone(date, t.id) ? 'on' : ''}" style="--mc:${t.color}"></i>`).join('');
      html += `
        <button class="mo-cell${out ? ' out' : ''}${date === today ? ' today' : ''}${all ? ' full-day' : ''}"
          data-date="${date}">
          <span class="mo-num">${day.getDate()}</span>
          <span class="mo-mini">${cells}</span>
        </button>`;
    }

    // 该行的每周任务完成概览
    const dots = WEEKLY_TASKS.map(t =>
      `<i class="${isWeeklyDone(wk, t.id) ? 'on' : ''}" style="--wc:${t.color}" title="${esc(t.name)}"></i>`).join('');
    html += `<div class="mo-ov" title="这一周的每周任务">${dots}</div>`;
  }

  $('moGrid').innerHTML = html;
  paintMonthMoney();
}

  const mk = monthKeyOf(state.cursor), pmk = prevMonthKey(mk);

/* 收益输入：可以带负号（亏了填 -120），空着返回 null */
function parseProfit(raw){
  const s = String(raw).trim();
  if (!s) return null;
  const neg = s.startsWith('-') || s.startsWith('−');
  const digits = s.replace(/[^\d.]/g, '');
  if (!digits) return null;
  const n = Number(digits);
  if (!isFinite(n)) return null;
  return Math.round((neg ? -n : n) * 100) / 100;
}

    };
    [codeEl, nameEl, costEl, pfEl].forEach(el =>
      el.addEventListener('input', () => el.classList.remove('bad')));

    $('finForm').addEventListener('submit', e => {
      e.preventDefault();
      const code = codeEl.value.trim();
      const name = nameEl.value.trim();
      const cost = parseAmount(costEl.value);
      const pf = parseProfit(pfEl.value);

      const miss = [];
      [codeEl, nameEl, costEl, pfEl].forEach(el => el.classList.remove('bad'));
      if (!code){ miss.push('基金代码'); codeEl.classList.add('bad'); }
      if (!name){ miss.push('基金名称'); nameEl.classList.add('bad'); }
      if (!cost){ miss.push('本金'); costEl.classList.add('bad'); }
      if (pf == null){ miss.push('收益'); pfEl.classList.add('bad'); }

      if (miss.length){
        hint.textContent = `还差${miss.join('、')}，四项填齐才能添加`;
        const firstBad = [codeEl, nameEl, costEl, pfEl].find(el => el.classList.contains('bad'));
        if (firstBad) firstBad.focus();
        return;
      }

      hint.textContent = '';
      addFinance(wk, code, name, cost, pf);
      repaint();
      [codeEl, nameEl, costEl, pfEl].forEach(el => { el.value = ''; el.classList.remove('bad'); });
      codeEl.focus();
    });

    /* 列表是重新渲染的，删除用事件委托 */
    $('finList').addEventListener('click', e => {
      const btn = e.target.closest('[data-act="del"]');
      if (!btn) return;
      const row = btn.closest('.fin-row');
      removeFinance(wk, row.dataset.fid);
      repaint();
    });
  });
}

/* 工资 / 资产：都只有一个数字，一个月一条，再存就覆盖；清空后保存就删掉这条 */
function openMoneySheet(kind){
  const isSal = kind === "salary";
  const mk = monthKeyOf(state.cursor);
  const [y, m] = mk.split("-");
  const cur  = isSal ? salaryOf(mk) : assetsOf(mk);
  const prev = isSal ? salaryOf(prevMonthKey(mk)) : lastAssets(mk);

  openSheet(`
    <h2 class="sh-title" id="shTitle">${y} 年 ${Number(m)} 月${isSal ? "工资" : "资产"}</h2>
    <label class="sh-field"><span class="sh-label">${isSal ? "本月收入" : "本月余额"}（元）</span>
      <input type="text" id="moneyInput" inputmode="decimal" autocomplete="off"
        placeholder="${prev != null ? fmtYuan(prev) : "0"}"
        value="${cur == null ? "" : cur}"></label>
    <p class="sh-hint" id="moneyHint"></p>
    <div class="sh-actions">
      <button class="ghost" data-close>取消</button>
      <button class="primary" id="moneySave">保存</button>
    </div>
  `, () => {
    const el = $("moneyInput"), hint = $("moneyHint");

    // 只留数字和一个小数点；资产可以开头带负号（负债也算进净资产）
    el.addEventListener("input", () => {
      let v = el.value.replace(/[^\d.-]/g, "");
      const neg = !isSal && v.startsWith("-");
      v = v.replace(/-/g, "");
      const i = v.indexOf(".");
      if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "");
      if (v.startsWith(".")) v = "0" + v;
      el.value = (neg ? "-" : "") + v;
      el.classList.remove("bad");
      hint.textContent = "";
      hint.classList.remove("bad");
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); $("moneySave").click(); }
    });

    $("moneySave").addEventListener("click", () => {
      const raw = el.value.trim();
      const v = parseProfit(raw);
      if (!raw){                              // 空着保存 = 清掉本月这条
        if (cur != null){
          if (isSal) setSalary(mk, null); else setAssets(mk, null);
          paintMonthMoney();
        }
        return closeSheet();
      }
      if (v == null || (isSal && v <= 0)){
        el.classList.add("bad");
        hint.textContent = isSal ? "收入要大于 0" : "填一个数字";
        hint.classList.add("bad");
        el.focus();
        return;
      }
      if (isSal) setSalary(mk, v); else setAssets(mk, v);
      paintMonthMoney();
      closeSheet();
    });
  });
}

/* 状态：入睡 + 起床 → 自动算时长；顺带记体重 */
function lastWeightBefore(date){
  for (let i = 1; i <= 30; i++){
    const v = weightOf(addDays(date, -i));
    if (v != null) return v;
  }
  return null;
}
function openSleepSheet(){
  const date = state.cursor;
  const l = sleepLog(date) || {};
  const kg = weightOf(date);
  const lastKg = lastWeightBefore(date);
  openSheet(`
    <h2 class="sh-title" id="shTitle">记录睡眠和体重</h2>
    <p class="sh-sub">填入睡和起床时间，睡满 7.5 小时才会点亮；体重可以只记一项。</p>
    <div class="sh-grid2">
      <label class="sh-field"><span class="sh-label">昨夜入睡</span>
        <input type="time" id="slBed" value="${l.bed || ''}"></label>
      <label class="sh-field"><span class="sh-label">今早起床</span>
        <input type="time" id="slWake" value="${l.wake || ''}"></label>
    </div>
    <div class="sh-result" id="slResult"></div>
    <label class="sh-field"><span class="sh-label">体重（kg）</span>
      <input type="number" id="slKg" inputmode="decimal" step="0.1" min="20" max="300"
        placeholder="${lastKg != null ? '上次 ' + fmtKg(lastKg) : '例如 62.4'}"
        value="${kg != null ? fmtKg(kg) : ''}"></label>
    <div class="sh-actions">
      <button class="ghost" data-close>取消</button>
      <button class="primary" id="slSave">保存</button>
    </div>
    ${(l.bed || kg != null) ? '<button class="sh-link" id="slClear">清除这天的状态记录</button>' : ''}
  `, () => {
    const bedEl = $('slBed'), wakeEl = $('slWake'), kgEl = $('slKg'), box = $('slResult');
    const paint = () => {
      if (!bedEl.value || !wakeEl.value){
        box.innerHTML = '<b>—</b><span class="sh-note">填好两个时间，这里自动算时长</span>';
        return;
      }
      const min = durationMin(bedEl.value, wakeEl.value);
      if (min == null){
        box.innerHTML = '<b>—</b><span class="sh-note">入睡与起床时间不能相同</span>';
        return;
      }
      const ok = min >= SLEEP_GOAL_MIN;
      const gap = Math.abs(SLEEP_GOAL_MIN - min);
      box.innerHTML = `<b>${fmtDur(min)}</b>
        <span class="sh-chip ${ok ? 'ok' : 'no'}">${ok ? '已达标' : `还差 ${fmtDur(gap)}`}</span>`;
    };
    paint();
    bedEl.addEventListener('input', paint);
    wakeEl.addEventListener('input', paint);
    kgEl.addEventListener('input', () => kgEl.classList.remove('bad'));

    $('slSave').addEventListener('click', () => {
      const raw = kgEl.value.trim();
      let kgVal = null;
      if (raw !== ''){
        const n = Number(raw);
        if (!isFinite(n) || n < 20 || n > 300){
          kgEl.classList.add('bad');
          kgEl.focus();
          return;
        }
        kgVal = Math.round(n * 10) / 10;
      }

      const hasTime = !!(bedEl.value || wakeEl.value);
      if (hasTime){
        const min = durationMin(bedEl.value, wakeEl.value);
        if (min == null){                       // 只填了一头，或两头相同
          paint();
          (bedEl.value ? wakeEl : bedEl).focus();
          return;
        }
      }
      if (!hasTime && kgVal == null && kg == null){
        box.innerHTML = '<b>—</b><span class="sh-note">睡眠时间和体重，至少填一样</span>';
        bedEl.focus();
        return;
      }

      if (hasTime) setLog(date, 'sleep', { bed: bedEl.value, wake: wakeEl.value, at: Date.now() });
      if (kgVal != null) setLog(date, 'weight', { kg: kgVal, at: Date.now() });
      else if (kg != null) setLog(date, 'weight', null);   // 清空输入 = 删掉这天的体重
      closeSheet();
      syncDay();
    });

    const clr = $('slClear');
    if (clr) clr.addEventListener('click', () => {
      setLog(date, 'sleep', null);
      setLog(date, 'weight', null);
      closeSheet();
      syncDay();
    });
  });
}

/* 近 7 天（不含当天）练过的部位次数 */
function recentFocusParts(endDate, days){
  const c = {}, n = days || 7;
  for (let i = 1; i <= n; i++){
    const l = logOf(addDays(endDate, -i), 'exercise');
    if (l && l.kind === 'focus' && l.focus && Array.isArray(l.focus.parts))
      l.focus.parts.forEach(p => { c[p] = (c[p] || 0) + 1; });
  }
  return c;
}
function hrText(v){
  const n = Math.round(Number(v));
  if (!n) return '';
  if (n < 100) return `平均 ${n} bpm · 热身 / 放松强度`;
  if (n < 131) return `平均 ${n} bpm · 轻松有氧`;
  if (n < 156) return `平均 ${n} bpm · 有氧区间`;
  if (n < 176) return `平均 ${n} bpm · 高强度`;
  return `平均 ${n} bpm · 冲刺强度`;
}

function openExerciseSheet(){
  const date = state.cursor;
  const cur  = logOf(date, 'exercise') || null;

  /* 草稿：三类各记一份，来回切换不丢已填内容 */
  const draft = {
    kind  : cur ? (cur.kind || 'function') : null,
    cardio: { type:'', hr:'', min:'30' },
    func  : { min:'30' },
    focus : { min:'30', parts: [] }
  };
  if (cur){
    const m = cur.minutes ? String(cur.minutes) : '';
    const cd = cur.cardio || {}, fc = cur.focus || {};
    if (draft.kind === 'cardio')     draft.cardio = { type: cd.type || '', hr: cd.hr ? String(cd.hr) : '', min: m };
    else if (draft.kind === 'focus') draft.focus  = { min: m, parts: Array.isArray(fc.parts) ? fc.parts.slice() : [] };
    else                             draft.func   = { min: m };
  }
  const picked = k => (k === 'cardio' ? draft.cardio : k === 'focus' ? draft.focus : draft.func);

  openSheet(`
    <h2 class="sh-title" id="shTitle">记录今天的运动</h2>
    <div class="ex-pick" id="exPick">
      ${Object.keys(EX_KINDS).map(k => {
        const c = EX_KINDS[k];
        return `<button type="button" class="ex-card" data-kind="${k}" aria-pressed="false"
          style="--c:${c.hex};--cd:${shade(c.hex, -0.22)}">
          <span class="ex-art">${EX_ART[k]}</span>
          <span class="ex-nm">${c.name}</span>
          <span class="ex-en">${c.en}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="ex-form" id="exForm" hidden></div>
    <p class="ex-note" id="exNote"></p>
    <div class="sh-actions">
      <button class="ghost" data-close>取消</button>
      <button class="primary" id="exSave">保存</button>
    </div>
    ${cur ? '<button class="sh-link" id="exClear">清除这天的运动记录</button>' : ''}
  `, () => {
    const formEl = $('exForm'), noteEl = $('exNote');

    const minField = v => `
      <label class="sh-field"><span class="sh-label">时长（分钟）</span>
        <input type="number" id="exMin" inputmode="numeric" min="1" max="600" step="1" placeholder="30" value="${esc(v)}">
      </label>
      <div class="sh-presets" id="exPresets">
        ${[15, 30, 45, 60, 90].map(n => `<button type="button" data-min="${n}">${n}</button>`).join('')}
      </div>`;

    const formHTML = kind => {
      if (kind === 'cardio'){
        const d = draft.cardio;
        return `
          <label class="sh-field"><span class="sh-label">类型</span>
            <input id="exType" autocomplete="off" placeholder="跑步 / 骑行 / 游泳…" value="${esc(d.type)}">
          </label>
          <div class="sh-presets ex-type-chips" id="exTypeChips">
            ${['跑步','骑行','游泳','球类','爬楼','爬坡','跳操'].map(t => `<button type="button" data-type="${t}">${t}</button>`).join('')}
          </div>
          <div class="sh-grid2">
            <label class="sh-field"><span class="sh-label">平均心率（bpm）</span>
              <input type="number" id="exHr" inputmode="numeric" min="40" max="240" step="1" placeholder="140" value="${esc(d.hr)}"></label>
            <label class="sh-field"><span class="sh-label">时长（分钟）</span>
              <input type="number" id="exMin" inputmode="numeric" min="1" max="600" step="1" placeholder="30" value="${esc(d.min)}"></label>
          </div>
          <div class="sh-presets" id="exPresets">
            ${[20, 30, 45, 60, 90].map(n => `<button type="button" data-min="${n}">${n}</button>`).join('')}
          </div>
          <p class="ex-hint" id="exHint"></p>`;
      }
      if (kind === 'focus'){
        const d = draft.focus;
        return `
          <div class="bf-wrap">
            ${BF_SVG}
            <div class="bf-chips" id="bfChips">
              ${Object.keys(FOCUS_PARTS).map(p => {
                const c = FOCUS_PARTS[p];
                return `<button type="button" data-part="${p}" style="--c:${c.color};--cd:${shade(c.color,-0.24)}">
                  <span class="bp-dot"></span>${c.name}</button>`;
              }).join('')}
            </div>
            <p class="bf-sub" id="bfSub"></p>
          </div>
          ${minField(d.min)}`;
      }
      return `${minField(draft.func.min)}`;
    };

    const paintParts = () => {
      document.querySelectorAll('.bf-part').forEach(g =>
        g.classList.toggle('on', draft.focus.parts.includes(g.dataset.part)));
      document.querySelectorAll('#bfChips [data-part]').forEach(b =>
        b.classList.toggle('on', draft.focus.parts.includes(b.dataset.part)));
      const sub = $('bfSub');
      if (sub){
        const rc = recentFocusParts(date);
        const list = Object.keys(FOCUS_PARTS).filter(p => rc[p]).map(p => `${FOCUS_PARTS[p].name} ×${rc[p]}`);
        sub.textContent = list.length ? `近 7 天练过：${list.join(' · ')}` : '点亮今天练到的部位，可以多选';
      }
    };
    const togglePart = p => {
      const i = draft.focus.parts.indexOf(p);
      if (i >= 0) draft.focus.parts.splice(i, 1); else draft.focus.parts.push(p);
      paintParts();
    };

    const collect = () => {
      if (!draft.kind) return;
      const d = picked(draft.kind);
      const m = $('exMin'); if (m) d.min = m.value;
      if (draft.kind === 'cardio'){
        const t = $('exType'); if (t) d.type = t.value;
        const h = $('exHr');   if (h) d.hr = h.value;
      }
    };

    const bind = () => {
      /* 有氧：类型 + 心率 */
      const typeEl = $('exType'), typeChips = $('exTypeChips');
      if (typeEl && typeChips){
        const syncType = () => typeChips.querySelectorAll('[data-type]').forEach(b =>
          b.classList.toggle('on', b.dataset.type === typeEl.value.trim()));
        typeEl.addEventListener('input', syncType);
        typeChips.addEventListener('click', e => {
          const b = e.target.closest('[data-type]');
          if (!b) return;
          typeEl.value = b.dataset.type;
          syncType();
        });
        syncType();
      }
      const hrEl = $('exHr'), hintEl = $('exHint');
      if (hrEl && hintEl){
        const paintHr = () => {
          hintEl.textContent = hrText(hrEl.value);
          hintEl.classList.toggle('on', Number(hrEl.value) > 0);
        };
        hrEl.addEventListener('input', paintHr);
        paintHr();
      }

      /* 时长 + 快捷值 */
      const minEl = $('exMin'), presets = $('exPresets');
      if (minEl && presets){
        const syncMin = () => presets.querySelectorAll('[data-min]').forEach(b =>
          b.classList.toggle('on', Number(b.dataset.min) === Number(minEl.value)));
        minEl.addEventListener('input', syncMin);
        presets.addEventListener('click', e => {
          const b = e.target.closest('[data-min]');
          if (!b) return;
          minEl.value = b.dataset.min;
          syncMin();
        });
        syncMin();
      }

      /* 专项：部位 */
      const chips = $('bfChips');
      if (chips){
        document.querySelectorAll('.bf-part').forEach(g => {
          g.addEventListener('click', () => togglePart(g.dataset.part));
        });
        chips.addEventListener('click', e => {
          const b = e.target.closest('[data-part]');
          if (!b) return;
          togglePart(b.dataset.part);
        });
        paintParts();
      }
    };

    const render = () => {
      document.querySelectorAll('#exPick .ex-card').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.kind === draft.kind)));
      formEl.hidden = !draft.kind;
      formEl.innerHTML = draft.kind ? formHTML(draft.kind) : '';
      noteEl.textContent = '';
      noteEl.classList.remove('miss');
      if (draft.kind) bind();
    };

    $('exPick').addEventListener('click', e => {
      const b = e.target.closest('.ex-card');
      if (!b || b.dataset.kind === draft.kind) return;
      collect();
      draft.kind = b.dataset.kind;
      render();
    });

    $('exSave').addEventListener('click', () => {
      if (!draft.kind){
        noteEl.textContent = '先选上面的一类运动';
        noteEl.classList.add('miss');
        return;
      }
      collect();
      const d = picked(draft.kind);
      const n = Math.round(Number(d.min));
      if (!(n > 0)){
        const m = $('exMin');
        if (m){ m.focus({ preventScroll: true }); m.classList.add('bad'); setTimeout(() => m.classList.remove('bad'), 900); }
        return;
      }
      const payload = { kind: draft.kind, minutes: Math.min(n, 600), at: Date.now() };
      if (draft.kind === 'cardio'){
        const hr = Math.round(Number(draft.cardio.hr));
        payload.cardio = { type: String(draft.cardio.type || '').trim().slice(0, 24), hr: hr >= 40 && hr <= 240 ? hr : null };
      }
      if (draft.kind === 'focus') payload.focus = { parts: draft.focus.parts.slice() };
      setLog(date, 'exercise', payload);
      closeSheet();
      syncDay();
    });

    const clr = $('exClear');
    if (clr) clr.addEventListener('click', () => { setLog(date, 'exercise', null); closeSheet(); syncDay(); });

    render();
  });
}

/* 给「西语练习 / 英语加强」用的对接接口
   pushReport 把数据写进工具自己的 key（唯一真身），本页不另存副本 */
window.ScheduleLink = {
  version: 1,
  /* ScheduleLink.pushReport('language', '2026-11-07', { done:true, minutes:25, items:'30 题' }) */
  pushReport(kind, date, data){
    const cfg = REPORT_LINKS[kind];
    if (!cfg || !data) return false;
    let all = null;
    try{ all = JSON.parse(localStorage.getItem(cfg.key) || 'null'); }catch(e){}
    if (!all || typeof all !== 'object') all = {};
    all[date] = { ...data, at: Date.now() };
    try{ localStorage.setItem(cfg.key, JSON.stringify(all)); }catch(e){ return false; }
    if (state.view === 'day' && state.cursor === date) syncDay();
    return true;
  },
  getLog(date, id){ return logOf(date, id); },
  isDone,
  keys: { language: REPORT_LINKS.language.key, english: REPORT_LINKS.english.key }
};

/* 另一个工具在同域写入时自动刷新（重算即可，不需要同步动作） */
window.addEventListener('storage', e => {
  if (!e.key) return;
  if (e.key === REPORT_LINKS.language.key || e.key === REPORT_LINKS.english.key) render();
});

   交互
   ========================================================= */
let suppressClick = false;
const flash = el => { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); };

$('tiles').addEventListener('click', e => {
  if (suppressClick){ suppressClick = false; return; }   // 刚长按过，不当成单次点击
  const minus = e.target.closest('[data-minus]');
  if (minus){                                            // 喝水：撤回一杯
    removeCup(state.cursor);
    syncDay();
    return;
  }
  const el = e.target.closest('.tile');
  if (!el) return;
  const id = el.dataset.id;

  if (id === 'water'){
    addCup(state.cursor);
    flash(el);
  } else if (DETAIL_TASKS[id]){
    openDetail(id);        // 睡眠 / 运动：弹层记录
    return;
  } else {
    toggle(state.cursor, id);
    if (isDone(state.cursor, id)) flash(el);
  }
  syncDay();
});

/* 喝水：长按减一杯（点错了能撤回） */
let waterPressTimer = null;
$('tiles').addEventListener('pointerdown', e => {
  const el = e.target.closest('.tile');
  if (!el || el.dataset.id !== 'water') return;
  clearTimeout(waterPressTimer);
  waterPressTimer = setTimeout(() => {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 900);
    if (removeCup(state.cursor)) flash(el);
    syncDay();
  }, 480);
});
['pointerup', 'pointercancel'].forEach(ev =>
  window.addEventListener(ev, () => clearTimeout(waterPressTimer)));
$('tiles').addEventListener('contextmenu', e => {
  if (e.target.closest('.tile[data-id="water"]')) e.preventDefault();
});

/* 键盘可达 */
$('tiles').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.tile');
  if (!el) return;
  e.preventDefault();
  el.click();
});

$('wkList').addEventListener('click', e => {
  const cell = e.target.closest('.mi');
  if (!cell) return;
  const date = cell.dataset.date, id = cell.dataset.id;

  if (id === 'water'){
    // 周视图只看达标与否：点一下补满 8 杯，再点清零
    setLog(date, 'water', cupsOf(date) >= WATER_GOAL ? null : { cups: WATER_GOAL, quick: true });
  } else if (DETAIL_TASKS[id]){
    // 睡眠 / 运动要填数据，跳到那天的日视图并弹层
    state.cursor = date;
    state.view = 'day';
    render();
    openDetail(id);
    return;
  } else {
    toggle(date, id);
  }

  cell.classList.toggle('on', isDone(date, id));
  const col = cell.closest('.wk-col');
  const cnt = col.querySelector('.wk-cnt');
  const n = doneCount(date), total = state.tasks.length;
  cnt.textContent = `${n}/${total}`;
  cnt.classList.toggle('full', total > 0 && n === total);
  paintHead();
});

/* 每周任务：点亮；理财复盘改成打开记账弹层 */
$('wtiles').addEventListener('click', e => {
  const el = e.target.closest('.wtile');
  if (!el) return;
  const id = el.dataset.wid;
  if (id === 'finance'){ openFinanceSheet(); return; }
  const wk = weekKeyOf(state.cursor);
  toggleWeekly(wk, id);
  const on = isWeeklyDone(wk, id);
  el.classList.toggle('done', on);
  el.setAttribute('aria-pressed', String(on));
  const n = weeklyDoneCount(wk);
  const sub = $('weeklySub');
  sub.textContent = `${n} / ${WEEKLY_TASKS.length}`;
  sub.classList.toggle('full', n === WEEKLY_TASKS.length);
});

/* 待办：勾选 / 删除 */
$('todoList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const row = btn.closest('.td');
  const wk = weekKeyOf(state.cursor);
  if (btn.dataset.act === 'toggle') toggleTodo(wk, row.dataset.tid);
  if (btn.dataset.act === 'del')    removeTodo(wk, row.dataset.tid);
  renderTodos();
});

/* 待办：新增 */
$('todoForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('todoInput');
  addTodo(weekKeyOf(state.cursor), input.value);
  input.value = '';
  renderTodos();
  input.focus();
});

/* 当日待办：勾选 / 删除 */
$('dayTodoList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const row = btn.closest('.td');
  const date = state.cursor;
  if (btn.dataset.act === 'toggle') toggleDayTodo(date, row.dataset.tid);
  if (btn.dataset.act === 'del')    removeDayTodo(date, row.dataset.tid);
  renderDayTodos();
});

/* 当日待办：新增 */
$('dayTodoForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('dayTodoInput');
  addDayTodo(state.cursor, input.value);
  input.value = '';
  renderDayTodos();
  input.focus();
});

/* 支出：删除 */
$('expList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act=del]');
  if (!btn) return;
  removeExpense(state.cursor, btn.closest('.exp').dataset.eid);
  renderExpenses();
});

/* 支出分类 chips：记住上一次选的，连续记同类账不用重复点 */
let curExpCat = 'food';
function paintExpCats(){
  document.querySelectorAll('#expCats [data-cat]').forEach(b => {
    const on = b.dataset.cat === curExpCat;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
}
function initExpCats(){
  $('expCats').innerHTML = EXP_CATS.map(c =>
    `<button type="button" data-cat="${c.id}" aria-pressed="false" style="--c:${c.color};--cd:${shade(c.color,-0.3)}">${c.name}</button>`).join('');
  paintExpCats();
}
$('expCats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  curExpCat = b.dataset.cat;
  paintExpCats();
});

/* 支出：记一笔 */
$('expForm').addEventListener('submit', e => {
  e.preventDefault();
  const reason = $('expReason'), amount = $('expAmount');
  if (!addExpense(state.cursor, reason.value, amount.value, curExpCat)){
    amount.focus();
    return;
  }
  reason.value = '';
  amount.value = '';
  renderExpenses();
  reason.focus();
});

/* 金额输入：只允许数字和一个小数点 */
$('expAmount').addEventListener('input', e => {
  const el = e.target;
  let v = el.value.replace(/[^\d.]/g, '');
  const i = v.indexOf('.');
  if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '');
  if (v.startsWith('.')) v = '0' + v;
  el.value = v;
});

$('moGrid').addEventListener('click', e => {
  const cell = e.target.closest('.mo-cell');
  if (!cell) return;
  state.cursor = cell.dataset.date;
  state.view = 'day';
  render();
});

/* 月视图：工资 / 资产 */
$('moSalaryCard').addEventListener('click', () => openMoneySheet('salary'));
$('moAssetsCard').addEventListener('click', () => openMoneySheet('assets'));

[...$('tabbar').children].forEach(b => {
  b.addEventListener('click', () => {
    state.view = b.dataset.view;
    if (state.view !== 'day') state.cursor = todayISO();
    render();
  });
});

$('btnPrev').addEventListener('click', () => step(-1));
$('btnNext').addEventListener('click', () => step(1));
$('btnToday').addEventListener('click', () => { state.cursor = todayISO(); render(); });

function step(dir){
  if (state.view === 'day')   state.cursor = addDays(state.cursor, dir);
  if (state.view === 'week'){
    state.cursor = addDays(state.cursor, dir * 7);
    const inp = $('todoInput');
    if (inp) inp.value = '';   // 换周时清掉未提交的草稿
  }
  if (state.view === 'month'){
    const d = fromISO(state.cursor);
    state.cursor = iso(new Date(d.getFullYear(), d.getMonth() + dir, 1));
  }
  render();
}

document.addEventListener('keydown', e => {
  if (!$('sheetWrap').hidden || !$('rpt').hidden) return;   // 浮层打开时不翻日期
  if (!$('rpt').hidden) return;                // 周报页打开时不翻日期
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key.toLowerCase() === 't'){ state.cursor = todayISO(); render(); }
});

/* ---------------- 数据迁移：旧的「喝水已打卡」转成 8 杯 ---------------- */
function migrateLegacy(){
  let changed = false;
  Object.keys(state.recs).forEach(date => {
    const rec = state.recs[date];
    if (!rec) return;
    if (rec.water){
      (state.logs[date] || (state.logs[date] = {})).water = { cups: WATER_GOAL, migrated: true };
      delete rec.water;
      changed = true;
    }
    if (!Object.keys(rec).length) delete state.recs[date];
  });
  if (changed){ saveRecs(); saveLogs(); }
}
migrateLegacy();

/* ---------------- 启动 ---------------- */
initExpCats();
render();
</script>
